<style>
:root { --azul:#0b5394; --verm:#d00000; --verde:#15803d; --fundo:#f4f7fb; --tinta:#14213d; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--tinta); background:var(--fundo); }
#topo { position:fixed; top:0; left:0; right:0; z-index:1000; background:var(--azul); color:#fff; padding:10px 14px; }
#topo .t { font-size:13px; opacity:.9; } #topo .n { font-size:18px; font-weight:800; }
#mapa { position:fixed; top:84px; bottom:0; left:0; right:0; }
#guia { position:fixed; top:92px; left:10px; right:10px; z-index:1000; background:#fff; border-radius:14px; padding:12px 14px; box-shadow:0 2px 10px rgba(0,0,0,.25); display:none; }
#guia .dir { font-size:22px; font-weight:800; } #guia .sub { font-size:14px; color:#3d4a63; margin-top:2px; }
#guia .barra { height:8px; background:#dfe6f0; border-radius:4px; margin-top:8px; overflow:hidden; } #guia .barra div { height:8px; background:var(--verde); width:0; }
#base { position:fixed; bottom:0; left:0; right:0; z-index:1000; padding:10px 10px calc(10px + env(safe-area-inset-bottom)); background:rgba(244,247,251,.96); display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
button { font:600 15px system-ui,sans-serif; border:0; border-radius:12px; min-height:50px; padding:6px 10px; cursor:pointer; }
.pri { background:var(--verm); color:#fff; grid-column:1/-1; font-size:18px; min-height:56px; }
.sec { background:#fff; color:var(--tinta); border:1px solid #c9d6e8; }
.lar { background:#b45309; color:#fff; }
#aviso { position:fixed; left:10px; right:10px; bottom:150px; z-index:1001; background:#14213d; color:#fff; border-radius:12px; padding:12px 14px; font-size:15px; display:none; }
.casa { background:rgba(255,255,255,.85); border:0; border-radius:4px; padding:0 3px; font-size:11px; font-weight:700; color:var(--azul); box-shadow:none; }
.casa::before { display:none; }
.rua { background:transparent; border:0; box-shadow:none; color:#fff; font-size:12px; font-weight:700; text-shadow:0 0 3px #000, 0 0 3px #000; white-space:nowrap; }
.rua::before { display:none; }
.seta { width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:14px solid #ffeb3b; filter:drop-shadow(0 0 1px #000); }
.eu { width:18px; height:18px; border-radius:50%; background:#2563eb; border:3px solid #fff; box-shadow:0 0 0 2px #2563eb; }
.ini { width:22px; height:22px; border-radius:50%; background:var(--verde); border:3px solid #fff; }

  $f("fGps").innerHTML = p ? `📍 Localização OK${precisao ? " (±" + Math.round(precisao) + " m)" : ""}`
    : gpsErro === "negado" ? `<b>⚠ Localização bloqueada para o aplicativo.</b><br>Toque no cadeado 🔒 ao lado do endereço lá em cima › <b>Permissões</b> › <b>Localização</b> › <b>Permitir</b>.<br>Se não tiver o cadeado: Configurações do celular › Apps › Chrome › Permissões › Localização › Permitir.<br>Depois toque no botão abaixo.${bt}`
    : gpsErro === "desligado" ? `<b>⚠ A localização do celular está desligada.</b><br>Puxe a barra de cima da tela e ligue <b>Localização</b>. Depois toque no botão abaixo.${bt}`
    : gpsErro === "sem" ? "⚠ Este celular não tem localização."
    : `📍 Pegando a localização… (pode levar até 1 minuto, de preferência fora de casa/prédio)${bt}`;
  $f("fGps").style.background = p ? "#e7f6ec" : "#fff7ed"; }
document.getElementById("bFora").onclick = () => { if (!ultimaPos) pedirLocalizacao(); else ligarGPS(); foraFoto = ""; $f("fHd").value = ""; $f("fPrev").style.display = "none"; $f("fBtFoto").textContent = "📷 Tirar foto do hidrômetro"; $f("fora").style.display = "flex"; foraGps(); clearInterval(foraTimer); foraTimer = setInterval(foraGps, 1500); };
$f("fCancelar").onclick = () => { $f("fora").style.display = "none"; clearInterval(foraTimer); };
$f("fBtFoto").onclick = () => $f("fFoto").click();
$f("fFoto").onchange = async e => { if (!e.target.files.length) return; try { foraFoto = await reduzir(e.target.files[0]); $f("fPrev").src = "data:image/jpeg;base64," + foraFoto.replace(/^data:image\/\w+;base64,/, ""); $f("fPrev").style.display = "block"; $f("fBtFoto").textContent = "📷 Tirar outra foto"; } catch (er) { aviso("Não consegui ler a foto. Tente de novo."); } e.target.value = ""; };
$f("fEnviar").onclick = () => {
  const hd = $f("fHd").value.trim().toUpperCase(), p = ultimaPos;
  if (!hd) { alert("Digite o número do hidrômetro."); return; }
  if (!foraFoto) { alert("Tire a foto do hidrômetro."); return; }
  if (!p) { pedirLocalizacao(); foraGps(); alert(gpsErro === "negado" ? "A localização está bloqueada. Siga o passo em laranja na tela para permitir." : gpsErro === "desligado" ? "Ligue a localização do celular (barra de cima da tela) e tente de novo." : "Ainda pegando a localização. Espere aparecer \"Localização OK\" e toque em Enviar."); return; }
  const id = "m" + Date.now().toString(36);
  enfileirar({ aba: "AlteracaoMatricula", foto: foraFoto, nomeFoto: "fora-da-rota-" + id + ".jpg", linha: [new Date().toISOString(), quem(), quem(), "fora_da_rota", id, "__FOTO__", p[0].toFixed(7), p[1].toFixed(7), "São Desidério · " + R.nome, "", "HD nº " + hd + " · matrícula fora da rota (enviada pelo mapa)", ""] });
  $f("fora").style.display = "none"; clearInterval(foraTimer);
  aviso(`<b>Matrícula fora da rota</b> ✔<br>HD ${hd}, foto e localização guardados.${navigator.onLine === false ? "<br>Sem internet agora: vai ser enviado sozinho quando o celular pegar internet." : ""}`, 6000);
};
document.getElementById("bHid").onclick = () => pedirFoto("Localização do hidrômetro");
document.getElementById("foto").onchange = async e => {
  if (!e.target.files.length) return;
  const p = ultimaPos;
  if (!p) { aviso("Ainda sem GPS. Espere o ponto azul aparecer no mapa e tire a foto de novo.", 6000); e.target.value = ""; return; }
  let foto = ""; try { foto = await reduzir(e.target.files[0]); } catch (er) { aviso("Não consegui ler a foto. Tente de novo."); return; }
  e.target.value = "";
  const agora = new Date().toISOString(), id = "m" + Date.now().toString(36);
  if (tipoFoto === "Matrícula fora da rota")
    enfileirar({ aba: "AlteracaoMatricula", foto, nomeFoto: "fora-da-rota-" + id + ".jpg", linha: [agora, quem(), quem(), "fora_da_rota", id, "__FOTO__", p[0].toFixed(7), p[1].toFixed(7), "São Desidério · " + R.nome, "", "Matrícula fora da rota (enviada pelo mapa)", ""] });
  else
    enfileirar({ aba: "LocalizacaoHidrometro", foto, nomeFoto: "hidrometro-" + id + ".jpg", linha: [agora, quem(), quem(), "__FOTO__", p[0].toFixed(7), p[1].toFixed(7), precisao ? Math.round(precisao) : "", "mapa · " + R.nome, "", ""] });
  aviso(`<b>${tipoFoto}</b> ✔<br>Foto e localização guardadas.${navigator.onLine === false ? "<br>Sem internet agora: vai ser enviado sozinho quando o celular pegar internet." : ""}`, 6000);
};
document.getElementById("bBaixar").onclick = async () => {
  if (navigator.onLine === false) { aviso("Faça isso no escritório, com internet."); return; }
  const b = rotaToda.getBounds().pad(0.15), urls = [];
  const tx = (lon, z) => Math.floor((lon + 180) / 360 * 2 ** z), ty = (lat, z) => Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * 2 ** z);
  for (let z = 15; z <= 19; z++) for (let x = tx(b.getWest(), z); x <= tx(b.getEast(), z); x++) for (let y = ty(b.getNorth(), z); y <= ty(b.getSouth(), z); y++)
    urls.push(`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`);
  if (urls.length > 2500) { aviso("Rota muito grande: vou baixar só até o zoom 18."); urls.splice(0, urls.length, ...urls.filter(u => !/\/tile\/19\//.test(u))); }
  let n = 0; const btn = document.getElementById("bBaixar");
  for (let i = 0; i < urls.length; i += 8) { await Promise.all(urls.slice(i, i + 8).map(u => fetch(u, { mode: "no-cors" }).catch(() => {}))); n = Math.min(urls.length, i + 8); btn.textContent = "⬇ Baixando " + Math.round(n / urls.length * 100) + "%"; }
  btn.textContent = "✔ Mapa salvo no celular"; aviso("Mapa desta rota salvo. Pode usar sem internet.");
};

// ===== Consulta da última leitura por matrícula (funciona sem internet: guarda a lista no celular) – 16/11 =====
const ULT_CHAVE = "ultLeit";
function ultCache() { try { return JSON.parse(localStorage.getItem(ULT_CHAVE) || "null"); } catch (e) { return null; } }
const ultNorm = v => String(v == null ? "" : v).toUpperCase().replace(/[^0-9A-Z]/g, "").replace(/^0+(?=\d)/, "");
async function ultBaixar(listar) {
  if (navigator.onLine === false) return ultCache();
  try { const d = await listar("UltimaLeitura"); if (!d || !d.length) return ultCache();
    const c = { em: new Date().toISOString(), dados: d.slice(1).filter(l => l[0] !== "" && l[0] != null) };
    try { localStorage.setItem(ULT_CHAVE, JSON.stringify(c)); } catch (e) {} return c; } catch (e) { return ultCache(); }
}
function ultDataTxt(v) { if (!v) return ""; const s = String(v); const m = s.match(/^(\d{4})-(\d\d)-(\d\d)/); if (m) { const d = new Date(s); if (!isNaN(d)) return d.toLocaleDateString("pt-BR"); return m[3] + "/" + m[2] + "/" + m[1]; } return s; }
function ultBuscar(q) {
  const c = ultCache(), n = ultNorm(q); if (!c || !n) return [];
  return c.dados.filter(l => ultNorm(l[0]) === n || (n.length >= 4 && ultNorm(l[5]).includes(n))).slice(0, 10);
}
function ultHtml(q) {
  const c = ultCache(), esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, x => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[x]));
  if (!c || !c.dados.length) return `<div style="color:#b45309">A lista de leituras ainda não foi carregada neste celular. Abra uma vez com internet.</div>`;
  if (!String(q || "").trim()) return `<div style="color:#555;font-size:14px">${c.dados.length} matrículas guardadas no celular · atualizado em ${new Date(c.em).toLocaleString("pt-BR").slice(0, 17)}</div>`;
  const r = ultBuscar(q);
  if (!r.length) return `<div style="color:#b00020;font-weight:bold">Matrícula não encontrada na lista.</div>`;
  return r.map(l => `<div style="padding:10px;border-radius:10px;background:#eef4fb;margin-top:6px"><div style="font-size:15px">Matrícula <b>${esc(l[0])}</b>${l[5] ? " · HD " + esc(l[5]) : ""}</div>
    <div style="font-size:26px;font-weight:800;color:#0b5394">${esc(l[1])}</div><div style="font-size:14px">última leitura${l[2] ? " em " + esc(ultDataTxt(l[2])) : ""}${l[7] ? " · ref. " + esc(l[7]) : ""}</div>
    <div style="font-size:13px;color:#555">${[l[3] && "grupo " + esc(l[3]), l[4] && "rota " + esc(l[4]), l[6] && esc(l[6])].filter(Boolean).join(" · ")}</div></div>`).join("");
}
const ultListar = async aba => { if (!LOGIN) return null; const r = await api({ acao: "listar", usuario: LOGIN.usuario, senha: LOGIN.senha, aba }); return r.erro ? null : r.dados; };
ultBaixar(ultListar);
document.getElementById("bUlt").onclick = () => { document.getElementById("ult").style.display = "flex"; const q = document.getElementById("ult_q"); q.value = ""; document.getElementById("ult_res").innerHTML = ultHtml(""); setTimeout(() => q.focus(), 100); };
document.getElementById("ult_q").oninput = e => { document.getElementById("ult_res").innerHTML = ultHtml(e.target.value); };
document.getElementById("ultFechar").onclick = () => { document.getElementById("ult").style.display = "none"; };
// 19/11: conta retida – salva matrícula + localização (vai para a lista "Contas retidas a entregar" e para a localização das matrículas)
let retTimer = null;
function retGps() { const p = ultimaPos, el = document.getElementById("rGps"), bt = `<button onclick="pedirLocalizacao();retGps()" style="display:block;width:100%;min-height:44px;margin-top:8px;border:0;border-radius:10px;background:#b45309;color:#fff;font:700 15px system-ui">📍 Ativar / permitir localização</button>`;
  el.innerHTML = p ? `📍 Localização OK${precisao ? " (±" + Math.round(precisao) + " m)" : ""}` : gpsErro === "negado" ? `<b>⚠ Localização bloqueada.</b> Toque no cadeado 🔒 ao lado do endereço › Permissões › Localização › Permitir.${bt}` : gpsErro === "desligado" ? `<b>⚠ Localização do celular desligada.</b> Ligue na barra de cima da tela.${bt}` : `📍 Pegando a localização…${bt}`;
  el.style.background = p ? "#e7f6ec" : "#fff7ed"; }
document.getElementById("bRet").onclick = () => { if (!ultimaPos) pedirLocalizacao(); else ligarGPS(); document.getElementById("rMat").value = ""; document.getElementById("ret").style.display = "flex"; retGps(); clearInterval(retTimer); retTimer = setInterval(retGps, 1500); };
document.getElementById("rCancelar").onclick = () => { document.getElementById("ret").style.display = "none"; clearInterval(retTimer); };
document.getElementById("rSalvar").onclick = () => {
  const mat = document.getElementById("rMat").value.replace(/\D/g, ""), p = ultimaPos;
  if (!mat) { alert("Digite o número da matrícula."); return; }
  if (!p) { pedirLocalizacao(); retGps(); alert("Ainda sem localização. Espere aparecer \"Localização OK\"."); return; }
  const agora = new Date().toISOString(), ll = p[0].toFixed(6) + "," + p[1].toFixed(6), id = "r" + Date.now().toString(36);
  enfileirar({ aba: "EntregaRetidas", linha: [agora, quem(), quem(), "retida_local", id, "São Desidério · " + R.nome, "Matrícula " + mat, "", "", "", "", ll] });
  enfileirar({ aba: "LocalizacaoMatricula", linha: ["'" + mat, ll, agora, quem(), "conta retida – " + R.nome] });
  document.getElementById("ret").style.display = "none"; clearInterval(retTimer);
  aviso(`<b>Conta retida</b> ✔ Matrícula ${mat} e o local foram guardados.${navigator.onLine === false ? "<br>Sem internet agora: vai ser enviado sozinho quando pegar internet." : ""}`, 6000);
};
desenhar();
</script>
