const LOCALIDADES_SEM_MAPA = ["Catolândia"];
// Aba BaseLocalizacao: matricula | coordenadas | fonte | data  (coordenadas no formato "lat,lon")
async function carregarBaseLocalizacao() {
  const base = {};
  try {
    const r = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "BaseLocalizacao" });
    if (r.erro) return base;
    r.dados.slice(1).forEach(l => {
      const m = String(l[0] || "").trim();
      const c = String(l[1] || "").match(/(-?\d+[.,]\d+)\s*[,; ]\s*(-?\d+[.,]\d+)/);
      if (m && c) base[m] = c[1].replace(",", ".") + "," + c[2].replace(",", ".");
    });
  } catch (e) {}
  return base;
}
async function carregarSemLocalizacao() {
  const box = document.getElementById("sl2_lista");
  if (!box) return;
  box.textContent = "Carregando...";
  try {
    const [res, base] = await Promise.all([
      chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "ExecucaoCampo" }),
      carregarBaseLocalizacao()
    ]);
    if (res.erro) { box.textContent = res.erro; return; }
    const cab = res.dados[0] || [];
    const linhas = res.dados.slice(1);
    const idxMat = cab.findIndex(h => /matr/i.test(String(h)));
    const idxLocal = cab.findIndex((h, k) => k >= 7 && /localiza|coordenad|mapa|gps/i.test(String(h)));
    if (idxMat < 0) { box.innerHTML = "<p>A aba ExecucaoCampo ainda não tem coluna de matrícula.</p>"; return; }
    linhas.filter(l => String(l[5]).toLowerCase() === "executada").forEach(l => {
      const g = String(l[6] || "").match(/GPS:\s*(-?\d+\.\d+),(-?\d+\.\d+)/);
      const pend = linhas.find(p => String(p[1]) === String(l[1]) && p[idxMat]);
      if (g && pend) base[String(pend[idxMat]).trim()] = g[1] + "," + g[2];
    });
    const executadas = new Set(linhas.filter(l => String(l[5]).toLowerCase() === "executada").map(l => String(l[1])));
    const faltam = {};
    linhas.filter(l => String(l[5]).toLowerCase() === "pendente" && !executadas.has(String(l[1]))).forEach(l => {
      const m = String(l[idxMat] || "").trim();
      const temNaLinha = idxLocal >= 0 && String(l[idxLocal] || "").trim();
      if (m && !temNaLinha && !base[m] && !LOCALIDADES_SEM_MAPA.includes(String(l[3]).trim())) (faltam[m] = faltam[m] || []).push(String(l[1]));
    });
    const mats = Object.keys(faltam);
    box.innerHTML = mats.length ? `<div class="nota">${mats.length} matrícula(s) sem localização nas SS pendentes</div>
      <textarea class="campo" rows="8" readonly>${mats.join("\n")}</textarea>
      ${mats.map(m => `<div class="card" style="margin-bottom:6px">Matrícula <b>${m}</b> · SS ${faltam[m].join(", ")}</div>`).join("")}` : "<p>Todas as SS pendentes têm localização.</p>";
  } catch (e) { box.textContent = "Não consegui carregar. Verifique a internet."; }
}
// Mostra uma coluna extra da aba ExecucaoCampo; localização vira link para o mapa
function campoExtraSS(nome, valor) {
  const v = String(valor == null ? "" : valor).trim();
  if (!v || !nome) return "";
  const rotulo = /hidrom/i.test(nome) ? "Nº do HD" : /^abertura$/i.test(nome) ? "Aberta em" : String(nome).replace(/_/g, " ");
  if (/localiza|coordenad|mapa|gps/i.test(nome)) {
    const c = v.match(/(-?\d+[.,]\d+)\s*[,; ]\s*(-?\d+[.,]\d+)/);
    const url = /^https?:/i.test(v) ? v : (c ? "https://www.google.com/maps?q=" + c[1].replace(",", ".") + "," + c[2].replace(",", ".") : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(v));
    return `<div style="font-size:14px;margin-top:4px"><a href="${url}" target="_blank">📍 Abrir localização no mapa</a></div>`;
  }
  if (/tel|fone|celular/i.test(nome)) {
    const num = v.replace(/\D/g, "");
    if (num.length >= 8) return `<div style="font-size:14px">${rotulo}: <a href="tel:${num}">📞 ${v}</a></div>`;
  }
  return `<div style="font-size:14px">${rotulo}: ${v}</div>`;
}
async function marcarExecutada(ss, tipo, loc) {

    // fotos do serviço (opcionais): carimbadas com a localização e enviadas antes do OK

    if (fotos.length && !pos && !semLocalEscolhido()) { window.marcandoEx = false; alert("A foto precisa ir com o GPS. Ligue a localização do celular, permita para o navegador e toque de novo."); return; }

      const base64 = await carimbarFoto(arq, pos);
      const r = await chamarApi({ acao: "salvarFoto", ...cred, base64: base64, tipo: arq.type, nome: arq.name });
      if (r.erro) { alert("Não consegui enviar a foto: " + r.erro); return; }
      links.push(r.url);
    }
    const confirmado = window.credenciais.usuario + (pos ? " | GPS: " + pos.lat.toFixed(6) + "," + pos.lon.toFixed(6) : "") + (links.length ? " | Fotos: " + links.join(" ") : "");
    const res = await chamarApi({ acao: "gravarVarias", ...cred, aba: "ExecucaoCampo",
      linhas: [[new Date().toISOString(), "'" + ss, tipo, loc, nomesDoUsuario(), "executada", confirmado]] });
    if (res.erro) { alert(res.erro); return; }
    if (links.length) {
      // com foto: vai para Encerrar SS > Anexar documento à SS já encerrada
      await chamarApi({ acao: "gravarVarias", ...cred, aba: "EncerrarSS",
        linhas: [[new Date().toISOString(), window.credenciais.usuario, "'" + ss, tipo, loc, "[ANEXAR DOCUMENTO] fotos do serviço executado", "anexar", "", "", links.join(" ")]] });
      delete window.fotosPex[ss];
    }
    // recarrega a tela que estiver aberta (SS pendente ou listas de SS em aberto)
    if (document.getElementById("sl_lista")) carregarSSLista(window.ssListaFiltro || null); else carregarPendExecutar();
  } catch (e) { alert("Não consegui marcar. Verifique a internet."); }
}

function pssFiltrar(dados) {

      // Some da tela quando a SS é respondida com o número. Abrir e encerrar com foto só some depois de marcar a foto anexada.
      .filter(p => p.situacao === "pendente" || (/ENCERRAR/.test(p.obs || "") && p.situacao === "respondida" && !!String(p.fotos || "").trim() && !p.fotoAnex))
      .map(p => p.situacao === "respondida" ? Object.assign(p, { situacao: "pendente", jaTemSS: p.ss }) : p)
      .filter(p => !sspPedidoNaTelaLocal(p.loc, p.obs)); // "Só gerar" e "Mandar no Digiteam" ficam em SS pendentes da localidade
    // Pedido à UNBA e Análise de consumo: só a Deyse vê
    const quemPss = normalizarNome(window.credenciais.usuario);
    const ehDeyse = quemPss.includes("deyse");
    const ehThiago = quemPss.includes("thiago") || quemPss.includes("tiago");
    const soSCI = /SCI|Segunda via|Análise de consumo|Débito|Digiteam|conta|matrícula/i;
    const visiveis = itens.filter(p => ehDeyse ? true : ehThiago ? !/^Pedido à UNBA/.test(p.tipo || "") /* 09/11: Thiago vê todos os pedidos (tudo cai no botão único) */ : !/^Pedido à UNBA|^Análise de consumo/.test(p.tipo || ""));
    return visiveis;

// Ficha da SS para achar o imóvel: nome, endereço completo, hidrômetro, telefone e observação em destaque
function sspFicha(campos) {
  const v = {}; campos.forEach(c => { const x = sspLimpo(c[1]); if (x && !v[c[0]]) v[c[0]] = x; });
  const semCod = t => String(t || "").replace(/^\d+\s*-\s*/, "").trim();
  const linha = (ic, html, grande) => `<div style="display:flex;gap:8px;align-items:flex-start;margin-top:5px;font-size:${grande ? 17 : 15}px;${grande ? "font-weight:600;" : ""}line-height:1.35"><span style="flex:0 0 22px;text-align:center">${ic}</span><span style="flex:1;min-width:0;overflow-wrap:anywhere">${html}</span></div>`;
  const end = [semCod(v["Endereço"]), semCod(v["Bairro"])].filter(Boolean).join(" – ");
  const tel = v["Telefone"] ? v["Telefone"].replace(/[^\d]/g, "") : "";
  const out = [];
  if (v["Cliente"]) out.push(linha("👤", sspEsc(v["Cliente"]), true));
  if (end) out.push(linha("📍", sspEsc(end), true));
  if (v["Hidrômetro"]) out.push(linha("🔢", "Hidrômetro: <b>" + sspEsc(v["Hidrômetro"]) + "</b>"));
  if (tel) out.push(linha("📞", `<a href="tel:${tel.length <= 9 ? "77" + tel : tel}">${sspEsc(v["Telefone"])}</a>`));
  if (v["Obs."]) out.push(linha("📝", "<b>Obs.:</b> " + sspEsc(v["Obs."])));
  if (v["Solicitante"] && v["Solicitante"] !== v["Cliente"]) out.push(linha("🙋", "Solicitante: " + sspEsc(v["Solicitante"])));
  if (v["Matrícula"]) out.push(`<div style="font-size:13px;color:#555;margin-top:5px">Matrícula ${sspEsc(v["Matrícula"])}</div>`);
  return out.length ? `<div style="background:#f6f9fc;border-radius:8px;padding:6px 10px;margin:6px 0">${out.join("")}</div>` : "";

      return { loc: SSP_LOCAIS[k], campo: l.filter(sspFaltaCampo).length, dig: l.filter(sspFaltaDig).length, foto: l.filter(sspFaltaFoto).length,
        venc: l.filter(it => it.prazo && it.prazo.vencida).length, parada: l.filter(it => it.parada).length, lista: l }; });
    // Quando cada SS/pedido entrou (para o tempo até a execução)
    const entrou = {};
    d.pe.forEach((l, i) => { entrou["P" + (i + 2)] = l[0]; const ss = sspLimpo(l[11]); if (ss) entrou[ss] = entrou[ss] || l[0]; });
    d.ex.forEach(l => { if (String(l[5]).toLowerCase().trim() === "pendente") { const ss = sspLimpo(l[1]); if (ss && !entrou[ss]) entrou[ss] = l[0]; } });
    // Execuções e digitações no período (a primeira de cada SS)
    const vistos = {}, porAgente = {}, porDig = {}, linhasCSV = [["data_hora", "ss", "tipo", "localidade", "situacao", "quem"]];
    let somaH = 0, nH = 0;
    d.ex.forEach(l => {
      const s = String(l[5] || "").toLowerCase().trim(); if (!["executada", "digitada", "foto anexada"].includes(s) || !noPeriodo(l[0])) return;
      const ss = sspLimpo(l[1]), chave = s + "|" + ss; if (vistos[chave]) return; vistos[chave] = 1;
      const quem = sspNome(String(l[6] || "").split("|")[0]) || sspNome(l[4]);
      linhasCSV.push([sspTxtData(l[0]), ss, l[2], l[3], s, quem]);
      if (s === "executada") { porAgente[quem] = (porAgente[quem] || 0) + 1;
        if (entrou[ss]) { const h = (new Date(l[0]) - new Date(entrou[ss])) / 3600e3; if (h >= 0 && h < 24 * 60) { somaH += h; nH++; } } }
      if (s === "digitada") porDig[quem] = (porDig[quem] || 0) + 1;
    });
    const pedidos = {}; d.pe.forEach(l => { if (noPeriodo(l[0]) && /^\[(S[ÓO] GERAR|MANDAR NO DIGITEAM|DIGITAR E ENCERRAR|ABRIR E ENCERRAR)\]/i.test(String(l[9] || ""))) pedidos[l[4] || "Sem localidade"] = (pedidos[l[4] || "Sem localidade"] || 0) + 1; });
    const totalExec = Object.values(porAgente).reduce((a, b) => a + b, 0), totalDig = Object.values(porDig).reduce((a, b) => a + b, 0);
    const media = nH ? (somaH / nH) : 0;
    const fmtH = h => h >= 48 ? (h / 24).toFixed(1).replace(".", ",") + " dias" : h.toFixed(1).replace(".", ",") + " h";
    const tab = (cab, linhas) => `<table><tr>${cab.map(c => `<th>${c}</th>`).join("")}</tr>${linhas.map(r => `<tr>${r.map(c => `<td>${sspEsc(c)}</td>`).join("")}</tr>`).join("")}</table>`;
    const ordem = o => Object.entries(o).sort((a, b) => b[1] - a[1]);
    window.rgTexto = [`*Painel EMBASA – resumo (${periodoTxt})*`,
      `Executadas em campo: ${totalExec}` + (nH ? ` · tempo médio até executar: ${fmtH(media)}` : ""),
      ...ordem(porAgente).map(([q, n]) => `  - ${q}: ${n}`),
      `Digitadas: ${totalDig}`, ...ordem(porDig).map(([q, n]) => `  - ${q}: ${n}`),
      `Pedidos de SS: ${Object.values(pedidos).reduce((a, b) => a + b, 0)}`, ...ordem(pedidos).map(([q, n]) => `  - ${q}: ${n}`),
      `*Situação agora*`, ...sit.map(s => `${s.loc}: falta campo ${s.campo} · falta digitação ${s.dig} · falta foto ${s.foto} · vencidas ${s.venc} · paradas ${s.parada}`)].join("\n");
    window.rgCSV = linhasCSV;
    const paradas = sit.flatMap(s => s.lista.filter(it => it.parada || (it.prazo && it.prazo.vencida)).map(it => [s.loc, it.ss || "pedido sem número", String(it.tipo).slice(0, 40), it.parada || "vencida"]));
    box.innerHTML = `<h3>Situação agora</h3>${tab(["Localidade", "Falta campo", "Falta digitação", "Falta foto", "Vencidas", "Paradas"], sit.map(s => [s.loc, s.campo, s.dig, s.foto, s.venc, s.parada]))}
      ${paradas.length ? `<h3 style="color:#c62828">Vencidas e paradas (${paradas.length})</h3>` + tab(["Localidade", "SS", "Tipo", "Motivo"], paradas) : ""}
      <h3>Executadas em campo – ${periodoTxt} (${totalExec})</h3>
      ${nH ? `<div class="nota">Tempo médio entre o pedido/lançamento e a execução: <b>${fmtH(media)}</b> (${nH} SS)</div>` : ""}
      ${totalExec ? tab(["Agente", "Executadas"], ordem(porAgente)) : "<p>Nenhuma no período.</p>"}
      <h3>Digitadas – ${periodoTxt} (${totalDig})</h3>${totalDig ? tab(["Digitador", "Digitadas"], ordem(porDig)) : "<p>Nenhuma no período.</p>"}
      <h3>Pedidos de SS – ${periodoTxt}</h3>${Object.keys(pedidos).length ? tab(["Localidade", "Pedidos"], ordem(pedidos)) : "<p>Nenhum no período.</p>"}
      <button class="acao" onclick="rgCopiar()">Copiar resumo (para WhatsApp ou e-mail)</button>
      <button class="acao" style="background:#2e7d32" onclick="rgBaixar()">Baixar planilha (CSV)</button>`;
  } catch (e) { box.textContent = "Não consegui carregar: " + (e && e.message ? e.message : "erro") + "."; }
}
function rgCopiar() {
  const t = window.rgTexto || "";
  const ok = () => alert("Resumo copiado. É só colar no WhatsApp ou no e-mail.");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, () => prompt("Copie o texto:", t));
  else prompt("Copie o texto:", t);
}
function rgBaixar() {
  const csv = (window.rgCSV || []).map(r => r.map(c => '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"').join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = "painel-embasa-relatorio-" + new Date().toLocaleDateString("en-CA", { timeZone: "America/Bahia" }) + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
}

// Saldo a partir da planilha: a última contagem é o ponto de partida; retiradas e entradas depois dela ajustam.
// Enquanto não houver contagem registrada, São Desidério usa a contagem antiga (transição).
function calcularSaldosAlmox(dados, local) {
  const estado = {};
  dados.slice(1).forEach(l => {
    // colunas: data_hora, usuario, local, tipo, material, quantidade, observacao
    if (l[2] !== local) return;
    const cod = String(l[4]).split(" – ")[0];
    const q = parseFloat(l[5]) || 0;
    const e = estado[cod] || (estado[cod] = { base: null, mov: 0 });
    if (String(l[3]).startsWith("Contagem")) { e.base = q; e.mov = 0; }
    else e.mov += String(l[3]).startsWith("Entrada") ? q : -q;
  });
  return estado;
}
function saldoDoItem(estado, local, cod, sdBase) {
  const e = estado[cod] || { base: null, mov: 0 };
  const base = e.base !== null ? e.base : (local === "ETA São Desidério" ? (parseFloat(sdBase) || 0) : 0);
  return base + e.mov;
}

async function estoqueGeral() {
  const local = document.getElementById("ac_local").value;
  const box = document.getElementById("al_geral");
  if (!local) { box.textContent = "Escolha o local do almoxarifado primeiro."; return; }
  try {
    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Almoxarifado" });
    if (res.erro) { box.textContent = res.erro; return; }
    const estado = calcularSaldosAlmox(res.dados, local);
    const linhas = CATALOGO_ALMOX.map(([c, d, sd]) => {
      const saldo = saldoDoItem(estado, local, c, sd);
      return `<tr><td>${c}</td><td>${d}</td><td style="${saldo <= 0 ? "color:#c62828;font-weight:bold" : ""}">${saldo}</td></tr>`;
    }).join("");
    box.innerHTML = `<p>${local}: ${CATALOGO_ALMOX.length} itens. Saldo em vermelho = zerado ou negativo.</p>
      <table><tr><th>Código</th><th>Material</th><th>Saldo</th></tr>${linhas}</table>`;
  } catch (e) { box.textContent = "Não consegui carregar. Verifique a internet."; }
}

async function mostrarSaldo() {
  const cod = document.getElementById("ac_mat").value;
  const local = document.getElementById("ac_local").value;
  const box = document.getElementById("ac_saldo");
  if (!cod || !local) { box.textContent = local ? "" : "Escolha o local primeiro."; return; }
  const item = itemCatalogo(cod);
  box.textContent = "Consultando saldo...";
  try {
    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Almoxarifado" });

    const estado = calcularSaldosAlmox(res.dados, local);
    const e = estado[cod] || { base: null, mov: 0 };

    box.textContent = "Saldo atual: " + saldo + (e.base !== null ? " (última contagem: " + e.base + ", movimentações depois dela: " + e.mov + ")" : " (sem contagem registrada ainda)");

// ===== SOLICITAÇÕES DE AQUISIÇÃO (RILC): a gerência analisa e responde; a resposta vai para Meus pedidos de quem pediu =====
// colunas da aba RILC: 1 data_hora, 2 usuario, 3 material, 4 quantidade, 5 urgencia, 6 prazo, 7 motivo_e_local, 8 situacao, 9 loja, 10 observacao, 11 respondido_por, 12 data_resposta
async function carregarSolicitacoesAquisicao(boxId = "aq_lista") {
  const box = document.getElementById(boxId);
  if (!box) return;
  box.textContent = "Carregando...";
  try {
    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "RILC" });
    if (res.erro) { box.textContent = res.erro; return; }
    const itens = res.dados.slice(1).map((l, i) => ({ linha: i + 2, quando: l[0], quem: l[1], material: l[2], qtd: l[3], urg: l[4], prazo: l[5], motivo: l[6], situacao: l[7] || "", loja: l[8] || "", obs: l[9] || "" }));
    itens.sort((a, b) => (a.situacao ? 1 : 0) - (b.situacao ? 1 : 0));
    if (!itens.length) { box.innerHTML = "<p>Nenhuma solicitação.</p>"; return; }
    box.innerHTML = itens.reverse().map(p => {
      const texto = `Solicitação RILC – ${p.quem}: ${p.material}, quantidade ${p.qtd}, urgência: ${p.urg}` + (p.prazo ? ", prazo: " + p.prazo : "") + `. Motivo/local: ${p.motivo}`;
      const resposta = p.situacao
        ? `<div style="margin-top:8px"><b>${p.situacao}</b>${p.loja ? " · loja: " + p.loja : ""}${p.obs ? " · " + p.obs : ""}</div>`
        : `<select id="aq_d_${p.linha}" class="campo"><option>Liberado</option><option>Não liberado</option></select>
           <input id="aq_l_${p.linha}" class="campo" placeholder="Loja onde buscar (se liberado)">
           <textarea id="aq_o_${p.linha}" class="campo" rows="2" placeholder="Observação"></textarea>
           <button class="acao" onclick="responderAquisicao(${p.linha})">Enviar resposta</button>`;
      return `<div class="card" style="margin-bottom:10px;border-left:6px solid ${p.situacao ? "#2e7d32" : "#c62828"}">
        <b>${p.material}</b> · qtd ${p.qtd} · ${p.urg}${p.prazo ? " · prazo " + p.prazo : ""}<br>
        <span style="font-size:14px">Pedido por ${p.quem} em ${formatarQuando(p.quando)} · ${p.motivo}</span>
        <button class="acao" style="margin:6px 0;padding:6px" onclick="navigator.clipboard.writeText(${JSON.stringify(texto).replace(/"/g, "&quot;")}).then(() => alert('Texto copiado.'))">Copiar texto (WhatsApp)</button>
        ${resposta}
      </div>`;
    }).join("");
  } catch (e) { box.textContent = "Não consegui carregar. Verifique a internet."; }
}
async function responderAquisicao(linha) {
  const decisao = document.getElementById("aq_d_" + linha).value;
  const loja = document.getElementById("aq_l_" + linha).value.trim();
  const obs = document.getElementById("aq_o_" + linha).value.trim();
  if (decisao === "Liberado" && !loja) { alert("Informe a loja onde buscar."); return; }
  try {
    const res = await chamarApi({ acao: "responderRilcPedido", usuario: window.credenciais.usuario, senha: window.credenciais.senha, linha: linha, decisao: decisao, loja: loja, observacao: obs });
    if (res.erro) { alert(res.erro); return; }
    alert("Resposta enviada. Aparece em Meus pedidos de quem pediu.");
    carregarSolicitacoesAquisicao();
  } catch (e) { alert("Não consegui enviar a resposta. Verifique a internet."); }
}

// ===== PEDIDOS DE EPI =====
// Aba EPI: data_hora | usuario | item | tamanho | quantidade | situacao | enviado_por | data_envio | data_assinatura | destino | encerrado_por | data_encerramento
// situacao: pendente (pedido) -> enviado (gerência enviou ao funcionário) -> assinado (funcionário recebeu e assinou a ficha) -> encerrado (gerência recebeu a ficha)
const EPI_ETAPAS = {
  pendente: "Pedido recebido, aguardando envio",
  enviado: "Enviado a você: receba, assine a ficha e confirme",
  assinado: "Ficha assinada, aguardando a gerência receber a ficha",
  encerrado: "Encerrado"
};
const EPI_COR = { pendente: "#c62828", enviado: "#f9a825", assinado: "#0a6e8a", encerrado: "#2e7d32" };
// Um pedido = todas as linhas com mesmo usuário e mesma data_hora (vários itens)
async function listarEpiGrupos() {
  const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "EPI" });
  if (res.erro) throw new Error(res.erro);
  const grupos = {};
  res.dados.forEach((l, i) => {
    if (i === 0 || !l[1]) return;
    const chave = String(l[1]).toLowerCase() + "|" + String(l[0]);
    if (!grupos[chave]) grupos[chave] = { chave, data: l[0], quem: l[1], destino: l[9] || "", situacao: l[5] || "pendente", linhas: [], itens: [], enviadoPor: l[6] || "", fim: l[11] || "" };
    grupos[chave].linhas.push(i + 1);
    grupos[chave].itens.push(`${l[2]} · tamanho ${l[3]} · qtd ${l[4]}`);
    if (l[5]) grupos[chave].situacao = l[5];
  });
  return Object.values(grupos).sort((x, y) => String(y.data) < String(x.data) ? -1 : 1);
}
function epiCard(g, papel) {
  const cor = EPI_COR[g.situacao] || "#c62828";
  let botao = "";
  if (papel === "gestao") {
    if (g.situacao === "pendente") botao = `<button class="acao" onclick="atualizarEpi(${g.linhas[0]}, 'enviado')">Marcar como enviado ao funcionário</button>`;
    if (g.situacao === "assinado") botao = `<button class="acao" onclick="atualizarEpi(${g.linhas[0]}, 'encerrado')">Ficha recebida: encerrar chamado</button>`;
  } else if (g.situacao === "enviado") {
    botao = `<button class="acao" onclick="atualizarEpi(${g.linhas[0]}, 'assinado')">Recebi e assinei a ficha</button>`;
  }
  const quem = papel === "gestao" ? `<b>${g.quem}</b> · ` : "";
  return `<div class="card" style="margin-bottom:8px;border-left:6px solid ${cor}">${quem}<b>${g.destino || "—"}</b><br>` +
    `<span style="font-size:14px">${g.itens.join("<br>")}</span><br>` +
    `<span style="font-size:14px">Pedido em ${formatarQuando(g.data)} · <b>${EPI_ETAPAS[g.situacao] || g.situacao}</b></span>${botao}</div>`;
}

async function carregarMeusPedidos() {
  const box = document.getElementById("mp_lista");

    html += "<h3>Pedidos de SS</h3>";
    const ssMinhas = rs.erro ? [] : rs.dados.slice(1).filter(l => String(l[1]).toLowerCase() === eu);

      const resp = /respondida|concluida/.test(String(l[10])) && l[11];
      if (l[10] === "cancelado") return `<div class="card" style="margin-bottom:8px;opacity:.7"><b>${l[2]}</b> · ${l[4]}<br><span style="font-size:14px">Pedido em ${formatarQuando(l[0])} · <span class="tag t-venc">Cancelado pela gerência (duplicado ou errado)</span></span></div>`;
      return `<div class="card" style="margin-bottom:8px"><b>${l[2]}</b> · ${l[4]}<br><span style="font-size:14px">Pedido em ${formatarQuando(l[0])} · ${resp ? "SS nº <b>" + l[11] + "</b>" + (l[14] ? " · enviada ao Digiteam de " + l[14] : "") + (l[16] ? " · concluída: " + l[16] : "") + (l[17] ? " · foto anexada: " + l[17] : "") : '<span class="tag t-alerta">Nas pendências do SCI, aguardando oportunidade</span>'}</span></div>`;
    }).join("") : "<p>Nenhum pedido de SS.</p>";
    const rr = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "RILC" });

// ===== HORA EXTRA: histórico (cada um vê o seu; a gerência vê todos) e relatório da gerência =====
// Percentual: sábado 70%; domingo e feriado 100%; demais dias úteis 50%
const FERIADOS_2026 = ["2026-01-01", "2026-04-03", "2026-04-21", "2026-05-01", "2026-06-04", "2026-07-02", "2026-09-07", "2026-10-12", "2026-11-15", "2026-11-20", "2026-12-25"];
function paraISO(v) {
  if (/^\d{4}-\d{2}-\d{2}/.test(String(v))) return String(v).slice(0, 10);
  return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(new Date(v));
}
function paraHHMM(v) {
  if (/^\d{1,2}:\d{2}/.test(String(v))) return String(v).slice(0, 5).padStart(5, "0");
  return new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date(v));
}
function percentualHoraExtra(dataISO) {
  if (FERIADOS_2026.includes(dataISO)) return 100;
  const dia = new Date(dataISO + "T12:00:00").getDay();
  if (dia === 0) return 100;
  if (dia === 6) return 70;
  return 50;
}
function horasEntre(ini, fim) {
  const [h1, m1] = ini.split(":").map(Number);
  const [h2, m2] = fim.split(":").map(Number);
  let min = (h2 * 60 + m2) - (h1 * 60 + m1);
  if (min < 0) min += 24 * 60;
  return min / 60;
}
function hhmm(decimal) {
  const total = Math.round(decimal * 60);
  return String(Math.floor(total / 60)).padStart(2, "0") + ":" + String(total % 60).padStart(2, "0");
}
// colunas da aba HoraExtra: registrado_em, usuario, tem_ss, ss, observacao, servico, localidade, bairro, logradouro, data_trabalho, inicio, fim, liberado
function registrosHoraExtra(res) {
  return res.dados.slice(1).map(l => ({
    quando: l[0], usuario: l[1], temSS: l[2], ss: l[3], obs: l[4], servico: l[5], localidade: l[6],
    bairro: l[7], logradouro: l[8], data: paraISO(l[9]), ini: paraHHMM(l[10]), fim: paraHHMM(l[11]), liberado: l[12] || "Não"
  })).filter(r => r.data && r.ini && r.fim);
}
function justificativaHoraExtra(r) {
  return r.temSS === "Sim" ? "SS nº " + r.ss + (r.obs ? " · " + r.obs : "") : r.obs;
}
function tabelaHoraExtra(lista) {
  if (!lista.length) return "<p>Nenhum registro.</p>";
  const cabecalho = "<tr><th>Data</th><th>Início</th><th>Fim</th><th>Horas</th><th>%</th><th>Justificativa</th><th>Serviço</th><th>Localidade</th><th>Liberado</th></tr>";
  const corpo = lista.map(r => {
    const h = horasEntre(r.ini, r.fim);
    return `<tr><td>${r.data.split("-").reverse().join("/")}</td><td>${r.ini}</td><td>${r.fim}</td><td>${hhmm(h)}</td><td>${percentualHoraExtra(r.data)}%</td><td>${justificativaHoraExtra(r)}</td><td>${r.servico || ""}</td><td>${r.localidade || ""}</td><td>${r.liberado}</td></tr>`;
  }).join("");
  return `<p>${lista.length} registro(s)</p><table>${cabecalho}${corpo}</table>`;
}
// Formato do formulário do consórcio: horas por percentual e total
function formularioHoraExtra(nome, lista) {
  const linhas = lista.slice().sort((a, b) => (a.data + a.ini).localeCompare(b.data + b.ini));
  let t50 = 0, t70 = 0, t100 = 0;
  const corpo = linhas.map(r => {
    const h = horasEntre(r.ini, r.fim);
    const p = percentualHoraExtra(r.data);
    if (p === 50) t50 += h; else if (p === 70) t70 += h; else t100 += h;
    return `<tr><td>${r.data.split("-").reverse().join("/")}</td><td>${r.ini}</td><td>${r.fim}</td>` +
      `<td>${p === 50 ? hhmm(h) : ""}</td><td>${p === 70 ? hhmm(h) : ""}</td><td>${p === 100 ? hhmm(h) : ""}</td><td>${justificativaHoraExtra(r)}</td></tr>`;
  }).join("");
  return `<h3>${nome}</h3>
    <table><tr><th>Data</th><th>Hora início</th><th>Hora fim</th><th>Horas 50%</th><th>Horas 70%</th><th>Horas 100%</th><th>Justificativa</th></tr>${corpo}
    <tr><td colspan="3"><b>Total de horas a pagar</b></td><td>${hhmm(t50)}</td><td>${hhmm(t70)}</td><td>${hhmm(t100)}</td><td><b>Total geral: ${hhmm(t50 + t70 + t100)}</b></td></tr></table>`;
}

async function salvarTela(btn, aba) {
  const area = btn.closest("main") || document.body;
  if (aba === "Leituras" && document.getElementById("mac_wrap")) {
    const wrap = document.getElementById("mac_wrap");
    const data = (area.querySelector('input[type="date"]') || {}).value || "";
    const linha = [data + "T07:00:00", window.credenciais.usuario, wrap.dataset.chave, document.getElementById("mac_leitura").value, document.getElementById("mac_consumo").value];
    try {
      const res = await chamarApi({ acao: "gravarVarias", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Leituras", linhas: [linha.map((c, k) => k >= 3 ? numOuTexto(c) : c)] });
      alert(res.erro ? res.erro : "Macro salvo no histórico.");
    } catch (e) {
      alert("Não consegui salvar. Verifique a internet.");
    }
    return;
  }
  if (aba === "Leituras" && document.getElementById("ms_leitura")) {
    const data = (area.querySelector('input[type="date"]') || {}).value || "";
    const dh = data + "T07:00:00";
    const u = window.credenciais.usuario;
    const linhas = [
      [dh, u, "Macro saída da ETA", document.getElementById("ms_leitura").value, document.getElementById("ms_consumo").value],
      [dh, u, "Macro Buriti Cortado", document.getElementById("bc_leitura").value, document.getElementById("bc_consumo").value]
    ];
    try {
      const res = await chamarApi({ acao: "gravarVarias", usuario: u, senha: window.credenciais.senha, aba: "Leituras", linhas: linhas.map(l => l.map((c, k) => k >= 3 ? numOuTexto(c) : c)) });
      alert(res.erro ? res.erro : "Leitura salva no histórico.");
    } catch (e) {
      alert("Não consegui salvar. Verifique a internet.");
    }
    return;
  }
  if (aba === "Niveis") {
    // Uma linha por reservatório e horário: data-hora da leitura, quem, reservatório, hora e nível
    const data = (area.querySelector('input[type="date"]') || {}).value || "";
    const heads = [...area.querySelectorAll("table th")].map(th => th.textContent).slice(1);
    const linhas = [], invalidos = [];
    area.querySelectorAll("table tr").forEach((tr, idx) => {
      if (idx === 0) return;
      const tds = tr.querySelectorAll("td");
      const hora = tds[0].textContent.trim();
      tds.forEach((td, j) => {
        if (j === 0) return;
        const bruto = td.querySelector("input").value.trim();
        if (bruto === "") return;
        const valor = numOuTexto(bruto);
        if (typeof valor !== "number") { invalidos.push(hora); return; }
        linhas.push([data + "T" + hora + ":00", window.credenciais.usuario, heads[j - 1], hora, valor]);
      });
    });
    if (invalidos.length) { alert("Nível inválido em: " + invalidos.join(", ") + ". Use só números, por exemplo 4,5."); return; }
    try {
      const res = await chamarApi({ acao: "gravarVarias", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Niveis", linhas: linhas });
      alert(res.erro ? res.erro : "Níveis salvos no histórico.");
    } catch (e) {
      alert("Não consegui salvar. Verifique a internet.");
    }
    return;
  }
  const campos = [...area.querySelectorAll("input, textarea, select")].map(c => c.value);
  const titulo = (document.querySelector("#app h2") || {}).textContent || "";
  try {
    const res = await chamarApi({
      acao: "gravar", usuario: window.credenciais.usuario, senha: window.credenciais.senha,
      aba: aba, linha: [titulo, JSON.stringify(campos)]
    });
    alert(res.erro ? res.erro : "Salvo no histórico.");
  } catch (e) {
    alert("Não consegui salvar. Verifique a internet.");
  }
}

const MACRO_HIST = {

  angico: [["ANG – Saída da ETA", "Saída da ETA Angico"]],

async function carregarMacrosHist(chave, data) {
  const box = document.getElementById("nh_macros");
  if (!box) return;
  box.textContent = "Carregando...";
  const fmtData = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" });
  try {
    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Leituras" });
    if (res.erro) { box.textContent = res.erro; return; }
    const doDia = {};
    res.dados.slice(1).forEach(l => {
      const q = new Date(l[0]);
      const dia = isNaN(q) ? String(l[0]).slice(0, 10) : fmtData.format(q);
      if (dia === data) doDia[l[2]] = { leitura: l[3], consumo: l[4], operador: l[1] };
    });
    box.innerHTML = `<table><tr><th>Macro</th><th>Leitura 7h (m³)</th><th>Consumo 24h (m³)</th><th>Operador</th></tr>` +
      MACRO_HIST[chave].map(([k, nome]) => { const v = doDia[k]; return `<tr><td>${nome}</td><td>${v && v.leitura !== "" ? v.leitura : "—"}</td><td>${v && v.consumo !== "" ? v.consumo : "—"}</td><td>${v ? v.operador : ""}</td></tr>`; }).join("") + `</table>`;
  } catch (e) { box.textContent = "Não consegui carregar. Verifique a internet."; }
}
function hojeISO() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" }).format(new Date());
}
function telaNivelHist(chave) {
  return `<h2>Histórico de níveis e macros – ${NIVEL_HIST[chave].titulo}</h2>
    <input type="date" id="nh_data" class="campo" value="${hojeISO()}" onchange="carregarNiveis('${chave}')">
    <h3>Macros (leitura e consumo das últimas 24 horas)</h3>
    <div id="nh_macros">Carregando...</div>
    <h3>Níveis dos reservatórios</h3>
    <div id="nh_lista">Carregando...</div>`;
}
async function carregarNiveis(chave) {
  const cfg = NIVEL_HIST[chave];
  const data = (document.getElementById("nh_data") || {}).value || hojeISO();
  const box = document.getElementById("nh_lista");
  if (!box) return;
  box.textContent = "Carregando...";
  if (MACRO_HIST[chave]) carregarMacrosHist(chave, data);
  const fmtData = new Intl.DateTimeFormat("en-CA", { timeZone: "America/Sao_Paulo" });
  const fmtHora = new Intl.DateTimeFormat("pt-BR", { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit", hour12: false });
  try {
    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Niveis" });
    if (res.erro) { box.textContent = res.erro; return; }
    const valores = {};
    res.dados.forEach((l, i) => {
      if (i === 0) return;
      // colunas: data_hora, usuario, reservatorio, hora, nivel_mca (a hora sai da data_hora)
      if (!cfg.reservatorios.includes(l[2])) return;
      const quando = new Date(l[0]);
      if (fmtData.format(quando) !== data) return;
      valores[fmtHora.format(quando) + "|" + l[2]] = { valor: l[4], operador: l[1], linha: i + 1 };
    });
    const multi = cfg.reservatorios.length > 1;
    let html = `<table><tr><th>Hora</th>${multi ? "<th>Reservatório</th>" : ""}<th>Nível (MCA)</th><th>Operador</th><th></th></tr>`;
    for (let h = cfg.inicio; h <= cfg.fim; h += 2) {
      const hora = String(h).padStart(2, "0") + ":00";
      cfg.reservatorios.forEach(r => {
        const v = valores[hora + "|" + r];
        const minha = v && (String(v.operador).toLowerCase() === String(window.credenciais.usuario).toLowerCase() || (window.MODO_GERENTE && !emPrevia())); // a gerente corrige qualquer nível
        const errado = v && (typeof v.valor !== "number" && (isNaN(Number(String(v.valor).replace(",", "."))) || /^\d{4}-\d{2}-\d{2}T/.test(String(v.valor))));
        html += `<tr><td>${hora}</td>${multi ? `<td>${r}</td>` : ""}<td>${v ? (errado ? '<b style="color:#c62828">⚠ valor errado – corrigir</b>' : v.valor) : "—"}</td><td>${v ? v.operador : ""}</td>` +
          `<td>${minha ? `<button class="acao" style="margin:0;padding:4px 8px" onclick="editarNivel('${chave}', ${v.linha}, '${v.valor}')">Editar</button>` : ""}</td></tr>`;
      });
    }
    box.innerHTML = html + "</table>";
  } catch (e) { box.textContent = "Não consegui carregar. Verifique a internet."; }
}
async function editarNivel(chave, linha, atual) {
  const novo = prompt("Novo nível (MCA):", atual);
  if (novo === null) return;
  const valor = novo.replace(",", ".").trim();
  if (isNaN(parseFloat(valor))) { alert("Digite um número, por exemplo 5.2"); return; }
  try {
    const res = await chamarApi({ acao: "editarNivel", usuario: window.credenciais.usuario, senha: window.credenciais.senha, linha: linha, valor: valor });
    alert(res.erro ? res.erro : "Nível atualizado.");
    carregarNiveis(chave);
  } catch (e) { alert("Não consegui editar. Verifique a internet."); }
}

const MAPA_PERFIS = {
  "agente_campo": "Agente de campo (exemplo: Luzenildo)",
  "operador_sd_terceirizado": "Operador ETA São Desidério (exemplo: Igor)",
  "operador_sd_proprio": "Operador ETA São Desidério próprio (exemplo: Acácio)",

  "atendente": "Atendente (Thiago)",
  "gerente": "Gerente (você)"
};

async function chamarApi(corpo, tentativa = 1) {
  let r;
  try {
    r = await fetch(URL_API, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(corpo) });
  } catch (e) {
    if (tentativa < 2) { await new Promise(ok => setTimeout(ok, 1500)); return chamarApi(corpo, tentativa + 1); }
    throw new Error(navigator.onLine === false ? "o celular está sem internet" : "a conexão falhou (sinal fraco ou foto muito grande)");
  }
  const t = await r.text();
  try { return JSON.parse(t); }
  catch (e) { throw new Error("o servidor respondeu com erro (código " + r.status + ")"); }
}

// SS em aberto por localidade, com contagem por tipo de serviço (planejamento do Digiteam)
// Fontes: ExecucaoCampo (situacao "pendente") e SSAbertas (ss | tipo | localidade | abertura | vencimento | situacao)
async function carregarSSAbertoLocal() {
  const box = document.getElementById("sal_lista");
  if (!box) return;
  const cred = { usuario: window.credenciais.usuario, senha: window.credenciais.senha };
  try {
    const [ex, sa] = await Promise.all([
      chamarApi({ acao: "listar", ...cred, aba: "ExecucaoCampo" }),
      chamarApi({ acao: "listar", ...cred, aba: "SSAbertas" }).catch(() => ({ dados: [] }))
    ]);
    if (ex.erro) { box.textContent = ex.erro; return; }
    const exec = (ex.dados || []).slice(1);
    const executadas = new Set(exec.filter(l => String(l[5]).toLowerCase() === "executada").map(l => String(l[1]).replace(/^'/, "")));
    const porSS = {};
    exec.filter(l => String(l[5]).toLowerCase() === "pendente").forEach(l => {
      const ss = String(l[1]).replace(/^'/, "");
      if (ss && !executadas.has(ss)) porSS[ss] = { tipo: String(l[2] || "Sem tipo"), loc: String(l[3] || "Sem localidade").trim() };
    });
    (sa.dados || []).slice(1).forEach(l => {
      const ss = String(l[0] || "").replace(/^'/, "");
      if (!ss || !/^\d{6,}$/.test(ss) || executadas.has(ss) || /encerrad|cancelad|conclu|saiu|escrit/i.test(String(l[5] || ""))) return;
      if (!porSS[ss]) porSS[ss] = { tipo: String(l[1] || "Sem tipo"), loc: String(l[2] || "Sem localidade").trim() };
    });
    const grupos = {};
    Object.values(porSS).forEach(x => { (grupos[x.loc] = grupos[x.loc] || {}); grupos[x.loc][x.tipo] = (grupos[x.loc][x.tipo] || 0) + 1; });
    const locs = Object.keys(grupos).sort();
    if (!locs.length) { box.innerHTML = "<p>Nenhuma SS em aberto.</p>"; return; }
    box.innerHTML = locs.map(loc => {
      const tipos = Object.entries(grupos[loc]).sort((a, b) => b[1] - a[1]);
      const total = tipos.reduce((s, t) => s + t[1], 0);
      return `<div class="card" style="margin-bottom:10px"><b>${loc}</b> – ${total} SS
        <table style="width:100%;border-collapse:collapse;margin-top:6px;font-size:14px"><tr><th style="text-align:left">Tipo de serviço</th><th style="text-align:right">Qtd</th></tr>
        ${tipos.map(([t, q]) => `<tr><td style="border-top:1px solid #eee;padding:4px 0">${t}</td><td style="border-top:1px solid #eee;text-align:right">${q}</td></tr>`).join("")}</table></div>`;
    }).join("");
  } catch (e) { box.textContent = "Não consegui carregar. Verifique a internet."; }
}
// Gerência: cancela demanda Agersa lançada errado (some da lista de todos; a linha fica na planilha como "cancelada")
async function cancelarDemandaAgersa(linha) {

// Versão do painel: mude junto com o texto do topo a cada publicação
const VERSAO_PAINEL = "10/11 16h54";
async function verificarVersao() {
  const msg = document.getElementById("versaoMsg");
  msg.textContent = "Verificando...";
  try {
    const t = await (await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" })).text();
    const m = t.match(/const VERSAO_PAINEL = "([^"]+)"/);
    if (m && m[1] !== VERSAO_PAINEL) {
      msg.innerHTML = `Nova versão ${m[1]} disponível. <button onclick="location.replace(location.pathname + '?v=' + Date.now())" style="background:#fff;color:#0b5394;border:none;border-radius:6px;padding:6px 10px;font-weight:600">Atualizar agora</button>`;
    } else msg.textContent = "Você já está na versão mais recente (" + VERSAO_PAINEL + ").";
  } catch (e) { msg.textContent = "Não consegui verificar. Veja a internet."; }
}
function sairPainel() {
  if (!confirm("Sair do painel?")) return;
  window.credenciais = null;
  try { localStorage.removeItem("painelLogin"); } catch (e) {}
  try { if (window.osPronto) window.osPronto.logout(); } catch (e) {}
  location.replace(location.pathname + "?v=" + Date.now());
}
async function entrar() {
  const usuario = document.getElementById("lg_usuario").value.trim();
  const senha = document.getElementById("lg_senha").value;
  const msg = document.getElementById("lg_msg");
  msg.textContent = "Entrando...";
  try {
    const res = await chamarApi({ acao: "login", usuario, senha });
    if (res.erro) { msg.textContent = res.erro; return; }
    const perfil = MAPA_PERFIS[res.usuario.perfil];
    if (!perfil) { msg.textContent = "Este perfil ainda não está liberado no painel."; return; }
    window.credenciais = { usuario, senha };
    try { localStorage.setItem("painelLogin", JSON.stringify({ usuario, senha })); } catch (e) {}
    perfilAtual = perfil;
    window.MODO_GERENTE = res.usuario.perfil === "gerente";
    window.nomeUsuario = res.usuario.nome;
    window.usuarioLocalidades = String(res.usuario.localidades || "").split(",").map(s => s.trim()).filter(Boolean);
    document.getElementById("perfil").style.display = res.usuario.perfil === "gerente" ? "" : "none";
    document.getElementById("login").style.display = "none";
    init();
    avisosVincular();
  } catch (e) {
    msg.textContent = "Não consegui conectar. Verifique a internet. (detalhe: " + (e && e.message ? e.message : e) + ")";
  }
}
// Versão nova do painel: atualiza sozinho (o login fica guardado), mas nunca no meio de um formulário.
// Confere ao abrir, a cada 3 minutos e sempre que o app volta para a tela.
function painelOcupado() {
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "button") return true;
  return [...document.querySelectorAll("#app input, #app textarea")].some(e => {
    if (e.type === "file") return e.files && e.files.length > 0;
    if (/^(hidden|button|submit|checkbox|radio|date)$/.test(e.type)) return false;
    return e.offsetParent !== null && String(e.value || "").trim() !== String(e.defaultValue || "").trim();
  }) || Object.keys(window.fotosSsp || {}).some(k => (window.fotosSsp[k] || []).length) || Object.keys(window.fotosPex || {}).some(k => (window.fotosPex[k] || []).length);
}
function atualizarQuandoLivre(nova) {
  if (!painelOcupado()) { location.replace(location.pathname + "?v=" + Date.now()); return; }
  const b = document.getElementById("avisoAtualizacao");
  if (b) { b.style.display = "block"; b.querySelector("span").textContent = "Versão nova do painel (" + nova + "). Ela entra sozinha quando você terminar o que está fazendo."; }
  clearTimeout(window.__timerVersao); window.__timerVersao = setTimeout(() => atualizarQuandoLivre(nova), 30000);
}
function checarVersaoSilenciosa() {
  if (window.__versaoNova) return atualizarQuandoLivre(window.__versaoNova);
  fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then(r => r.text()).then(t => {
    const m = t.match(/const VERSAO_PAINEL = "([^"]+)"/);
    if (!m || m[1] === VERSAO_PAINEL) return;
    window.__versaoNova = m[1]; atualizarQuandoLivre(m[1]);
  }).catch(() => {});
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checarVersaoSilenciosa(); });
// ===== AVISOS NO CELULAR (OneSignal): SS nova, serviço urgente e pedidos chegam como notificação =====
// O celular fica ligado ao usuário do painel (external_id = usuário em minúsculas). Quem envia é o Codigo.gs (a cada 5 min).
const ONESIGNAL_APP_ID = "ffb50baa-3d6c-47b3-9d6a-b3ac84d50ba1";
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function (OneSignal) {
  try {
    await OneSignal.init({ appId: ONESIGNAL_APP_ID, serviceWorkerPath: "painel-embasa/sw.js", serviceWorkerParam: { scope: "/painel-embasa/" } });
    window.osPronto = OneSignal;
    OneSignal.Notifications.addEventListener("permissionChange", () => avisosAtualizarBotao());
    avisosAtualizarBotao();
  } catch (e) {}
});
async function avisosVincular() {
  const OS = window.osPronto; if (!OS || !window.credenciais) return;
  try { await OS.login(String(window.credenciais.usuario).trim().toLowerCase()); } catch (e) {}
}
function avisosAtualizarBotao() {
  const b = document.getElementById("btnAvisos"), OS = window.osPronto; if (!b || !OS) return;
  b.style.display = OS.Notifications.permission ? "none" : "";
  avisosVincular();
}
async function ativarAvisos() {
  const OS = window.osPronto;
  if (!OS) { alert("Aguarde alguns segundos e toque de novo."); return; }
  try { await OS.Notifications.requestPermission(); } catch (e) {}
  await avisosVincular(); avisosAtualizarBotao();
  alert(OS.Notifications.permission ? "Pronto! Você vai receber aviso no celular quando chegar SS nova ou serviço urgente."
    : "As notificações estão bloqueadas. Libere em Configurações do celular > Apps > Chrome (ou Painel EMBASA) > Notificações e toque de novo.");
}
// Aplicativo instalável (PWA): registra o service worker e mostra "Instalar aplicativo" quando o Chrome permitir
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.pedidoInstalar = e; const b = document.getElementById("btnInstalar"); if (b) b.style.display = ""; });
window.addEventListener("appinstalled", () => { const b = document.getElementById("btnInstalar"); if (b) b.style.display = "none"; });
function instalarApp() {
  const p = window.pedidoInstalar;
  if (!p) { alert("No Chrome, toque nos três pontinhos (⋮) e depois em \"Instalar aplicativo\" ou \"Adicionar à tela inicial\"."); return; }
  p.prompt(); p.userChoice.finally(() => { window.pedidoInstalar = null; const b = document.getElementById("btnInstalar"); if (b) b.style.display = "none"; });
}
// Entra sozinho com o login salvo no aparelho, para não precisar sair e entrar depois de cada atualização
(function entrarAutomatico() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem("painelLogin") || "null"); } catch (e) { s = null; }
  if (s && s.usuario && s.senha) {
    document.getElementById("lg_usuario").value = s.usuario;
    document.getElementById("lg_senha").value = s.senha;
    entrar();
  }
  checarVersaoSilenciosa();
  setInterval(checarVersaoSilenciosa, 3 * 60 * 1000);
  // 10/11: números e listas de SS se atualizam sozinhos a cada 1 minuto (quando outro digitador ou o campo informa algo).
  // Não atualiza a lista se a pessoa estiver digitando, com SS marcadas ou com leitura/observação preenchida.
  setInterval(() => {
    try {
      if (document.visibilityState !== "visible" || !window.credenciais) return;
      const lista = document.getElementById("ssp_lista");
      if (lista && window.sspChave) {
        const ocupado = (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && lista.contains(document.activeElement))
          || lista.querySelector("input[type=checkbox]:checked") || [...lista.querySelectorAll("input:not([type]),input[type=text],textarea")].some(e => e.value.trim())
          || lista.querySelector("button:disabled");
        if (!ocupado) { window.sspSilencioso = true; carregarSSPend(window.sspChave); }
      } else if (!pilha.length && document.querySelector("#app button.btn")) atualizarContagemSS();
    } catch (e) {}
  }, 60 * 1000);
})();
