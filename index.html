<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel EMBASA</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b5394">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f2f4f7; color: #1d2330; font-size: 17px; }
  header { background: #0b5394; color: #fff; padding: 14px 16px; }
  header h1 { margin: 0 0 8px; font-size: 18px; }
  select { width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: none; }
  .aviso-proto { background: #fff3cd; color: #6b4e00; padding: 8px 16px; font-size: 14px; border-bottom: 1px solid #e6d28a; }
  .aviso { background: #fff3cd; border-left: 6px solid #e0a800; padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 15px; }
  .urgente { background: #fde2e2; border-left: 6px solid #c62828; padding: 12px; border-radius: 8px; margin: 12px 0; }
  .vermelho { background: #c62828; color: #fff; padding: 12px; border-radius: 8px; margin: 12px 0; font-weight: 600; }
  main { padding: 12px 16px 40px; }
  .atualizado { font-size: 14px; color: #555; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { background: #fff; border: 1px solid #cfd6e0; border-radius: 12px; padding: 16px 10px; text-align: center; font-size: 16px; font-weight: 600; cursor: pointer; min-height: 72px; }
  .btn small { display: block; font-weight: 400; color: #555; font-size: 13px; margin-top: 4px; }
  .btn:active { background: #e8f0fb; }
  .voltar { background: none; border: none; color: #0b5394; font-size: 16px; padding: 8px 0; cursor: pointer; font-weight: 600; }
  h2 { font-size: 19px; margin: 8px 0 10px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; font-size: 14px; }
  th, td { padding: 8px; border-bottom: 1px solid #eef1f5; text-align: left; vertical-align: top; }
  th { background: #e9eef6; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .t-ok { background: #d8f3dc; color: #1b5e20; }
  .t-alerta { background: #fff3cd; color: #7a5a00; }
  .t-venc { background: #fde2e2; color: #b71c1c; }
  .campo { display: block; width: 100%; padding: 12px; font-size: 16px; border: 1px solid #cfd6e0; border-radius: 8px; margin: 6px 0 12px; background: #fff; }
  .acao { background: #0b5394; color: #fff; border: none; padding: 14px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: 600; margin-top: 8px; }
  .nota { font-size: 13px; color: #555; margin-top: 10px; }
  .cards { display: grid; gap: 8px; }
  .card { background: #fff; border-radius: 10px; padding: 12px; border: 1px solid #e3e8ef; }
</style>
</head>
<body>

<div id="avisoAtualizacao" style="display:none;background:#c62828;color:#fff;padding:12px 16px;font-weight:bold;font-size:15px"><span>Há uma atualização do painel.</span> <button onclick="location.replace(location.pathname + '?v=' + Date.now())" style="margin-left:6px;background:#fff;color:#c62828;border:none;border-radius:6px;padding:6px 10px;font-weight:bold">Atualizar agora</button></div>
<header>
  <h1>Painel EMBASA</h1>
  <div id="versaoTexto" style="font-size:12px;opacity:.85">Versão 10/11 16h54</div>
  <select id="perfil" onchange="trocarPerfil()"></select>
  <button onclick="telaTrocarSenha()" style="display:none;margin-top:8px;background:#fff;color:#0b5394;border:none;border-radius:8px;padding:8px 12px;font-weight:600">Trocar minha senha</button>
  <button onclick="sairPainel()" style="margin-top:8px;background:#c62828;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:600">Sair</button>
  <button id="btnAvisos" onclick="ativarAvisos()" style="display:none;margin-top:8px;background:#f9a825;color:#1d2330;border:none;border-radius:8px;padding:8px 12px;font-weight:700">🔔 Ativar avisos no celular</button>
  <button id="btnInstalar" onclick="instalarApp()" style="display:none;margin-top:8px;background:#2e7d32;color:#fff;border:none;border-radius:8px;padding:8px 12px;font-weight:600">📲 Instalar aplicativo</button>
  <div id="versaoMsg" style="font-size:13px;margin-top:6px"></div>
</header>
<div class="aviso-proto" style="display:none">As SS são atualizadas pelo escritório com o Excel do SCI, em horário comercial (segunda a sexta, 7h30 às 12h e 13h30 às 17h30).</div>

<div id="login" style="position:fixed;inset:0;background:#0b5394;display:flex;align-items:center;justify-content:center;z-index:9">
  <div style="background:#fff;padding:24px;border-radius:12px;width:90%;max-width:340px">
    <h2>Entrar no Painel EMBASA</h2>
    <input id="lg_usuario" class="campo" placeholder="Usuário" autocomplete="username">
    <input id="lg_senha" type="password" class="campo" placeholder="Senha" autocomplete="current-password">
    <button class="acao" onclick="entrar()">Entrar</button>
    <button onclick="esqueciSenha()" style="background:none;border:none;color:#0b5394;margin-top:10px;cursor:pointer;text-decoration:underline">Esqueci a senha</button>
    <div id="lg_msg" class="nota"></div>
  </div>
</div>
<main id="app"></main>

<script>
/* ============================================================
   BLOCOS REUTILIZÁVEIS
   ============================================================ */
const BANNER_VERIF = ``;
const AVISO_DIGITINHO =`<div class="aviso"><b>Antes de solicitar SS:</b> confirme que você está logado no Digiteam.</div>`;

// Tela de um macro com consumo automático (chave = nome guardado na planilha)
function macroHTML(titulo, rotulo, chave) {
  return `<h2>${titulo}</h2>
    <input type="date" class="campo" value="${hojeISO()}">
    <div id="mac_wrap" data-chave="${chave}" class="card" style="margin-bottom:10px">
      <b>${rotulo}</b>
      <input id="mac_leitura" class="campo" placeholder="Leitura 7h (m³)" oninput="calcularMacro()">
      <input id="mac_consumo" class="campo" readonly placeholder="Consumo 24h (automático)">
    </div>
    <button class="acao" onclick="salvarTela(this, 'Leituras')">Salvar macro</button>`;
}

function GRADE(nomes, inicio = 0, fim = 22) {
  const horas = [];
  for (let h = inicio; h <= fim; h += 2) horas.push(String(h).padStart(2, "0") + ":00");
  return `<input type="date" class="campo" value="${hojeISO()}"><div class="nota">Leitura a cada 2 horas, de ${String(inicio).padStart(2, "0")}:00 às ${String(fim).padStart(2, "0")}:00.</div>
    <table><tr><th>Hora</th>${nomes.map(n => `<th>${n}</th>`).join("")}</tr>` +
    horas.map(h => `<tr><td>${h}</td>${nomes.map(() => `<td><input class="campo" style="margin:0;padding:6px" placeholder="MCA"></td>`).join("")}</tr>`).join("") +
    `</table><button class="acao" style="background:#555" onclick="verHistorico('Niveis')">Ver histórico de níveis</button>`;
}

function tabela(cab, linhas) {
  return `<table><tr>${cab.map(c => `<th>${c}</th>`).join("")}</tr>` +
    linhas.map(l => `<tr>${l.map(c => `<td>${c}</td>`).join("")}</tr>`).join("") + `</table>`;
}

const ATUALIZADO = `<div class="atualizado">Última atualização do SCI: 09:00 (próxima: 10:00)</div>`;

/* Telas de exemplo */
const TELAS = {
  vencimentos: () => ATUALIZADO + `
    <h2>Vencimentos</h2>
    ${tabela(["Prazo","Tipo","Localidade / Bairro","Matrícula","Endereço"],[
      ['<span class="tag t-venc">Até 24h</span>','Corte','Sede / Bairro A','000001','Rua exemplo, 10'],
      ['<span class="tag t-venc">Até 24h</span>','Vazamento de rede','Sede / Bairro B','–','Rua exemplo, 25'],
      ['<span class="tag t-alerta">24h a 48h</span>','Religação','Sede / Bairro A','000002','Rua exemplo, 40'],
      ['<span class="tag t-venc">Atrasada</span>','Falta de água','Sede / Bairro C','000003','Rua exemplo, 5']
    ])}
    <div class="nota">Itens com "Estado" preenchido não aparecem aqui. Se a SS já foi executada no Digiteam, aguarda o escritório.</div>`,

  todasSS: () => ATUALIZADO + `
    <h2>Todas as SS abertas (últimos 90 dias)</h2>
    <p><b>Resumo:</b> Corte: 50 · Vazamento: 8 · Religação: 3</p>
    <select class="campo"><option>Todas as localidades</option></select>
    <select class="campo"><option>Todos os bairros</option></select>
    <select class="campo"><option>Ordenar por prazo</option></select>
    ${tabela(["Prazo","Tipo","Bairro","Endereço"],[
      ['Hoje 16h','Corte','Bairro A','Rua exemplo, 1'],
      ['Amanhã','Corte','Bairro A','Rua exemplo, 3'],
      ['Em 3 dias','Corte','Bairro B','Rua exemplo, 9']
    ])}`,

  verificacoes: () => perfilAtual.startsWith("Gerente") ? `
    <h2>Criar verificação rápida</h2>
    <input class="campo" placeholder="Local (ex.: Booster de Porto Rico)">
    <textarea class="campo" rows="2" placeholder="O que verificar (ex.: a bomba está ligada?)"></textarea>
    <select class="campo"><option>Responsável…</option><option>Exemplo: Ramon</option><option>Exemplo: Ivo Carlos</option></select>
    <select class="campo"><option>Prazo…</option><option>Até hoje</option><option>Até amanhã</option></select>
    <button class="acao">Enviar para o funcionário</button>
    <h2 style="margin-top:20px">Acompanhamento</h2>
    <div class="card">Booster de Porto Rico · Pendente · Resultado: –</div>` : `
    <h2>Verificações rápidas</h2>
    <div class="card" style="margin-bottom:10px">
      <b>Booster de Porto Rico: verificar se a bomba está ligada</b><br>
      <span style="font-size:14px">Pedido da gerência · 02/11 06:30 · Prazo: hoje</span><br><br>
      <textarea class="campo" rows="2" placeholder="Resultado (ex.: ligada, funcionando)"></textarea>
      <button class="acao">Marcar como feito</button>
    </div>
    <div class="nota">Verificação não gera SS. Se ficar sem marcar até o fim do dia, aparece para a gerência.</div>`,

  ocorAbrir: () => telaOcorAbrir(),
  ocorMinhas: () => `<h2>Minhas ocorrências</h2><div id="om_lista">Carregando...</div>`,



  nivelAngico: () => `
    <h2>Níveis – ETA Angico</h2>
    ${GRADE(["RAD Angico"], 5, 17)}
    <button class="acao" onclick="salvarTela(this, 'Niveis')">Salvar nível</button>`,

  nivelSD: () => `
    <h2>Níveis – ETA São Desidério</h2>
    ${GRADE(["Semi-enterrado 1", "RAD 2 (apoiado de distribuição 2)"])}
    <button class="acao" onclick="salvarTela(this, 'Niveis')">Salvar níveis</button>`,

  nivelMozondo: () => `
    <h2>Níveis – ETA Mozondó</h2>
    ${GRADE(["Reservatórios ETA Mozondó (um nível, vale para os dois)"])}
    <button class="acao" onclick="salvarTela(this, 'Niveis')">Salvar nível</button>`,

  leituraMozondo: () => {
    const horas = ["08:00","10:00","12:00","14:00","16:00","18:00","20:00","22:00","00:00","02:00","04:00","06:00"];
    return `
    <h2>Leitura diária – ETA Mozondó</h2>
    <input type="date" class="campo" value="${hojeISO()}">
    <div class="urgente"><b>ALERTA: nível abaixo de 1 m</b><br><span style="font-size:14px">Mozondó · 14h às 18h em 0,0 MCA · enviado para Isaque, Ivo Carlos e Jânio Gualberto em Informações urgentes</span></div>
    <input class="campo" placeholder="Operador">
    <div class="card" style="margin-bottom:10px"><b>Macro saída da ETA</b>
      <input id="ms_leitura" class="campo" value="808184" placeholder="Leitura 7h (m³)" oninput="calcularConsumosMozondo()">
      <input id="ms_consumo" class="campo" readonly placeholder="Consumo 24h (automático)">
    </div>
    <div class="card" style="margin-bottom:10px"><b>Macro Buriti Cortado</b>
      <input id="bc_leitura" class="campo" value="3696" placeholder="Leitura 7h (m³)" oninput="calcularConsumosMozondo()">
      <input id="bc_consumo" class="campo" readonly placeholder="Consumo 24h (automático)">
    </div>
    <h2>Nível do reservatório (MCA, a cada 2h)</h2>
    <table><tr><th>Hora</th><th>Nível (MCA)</th></tr>
    ${horas.map((h, i) => `<tr><td>${h}</td><td><input class="campo" style="margin:0;padding:6px" value="${["5.0","5.0","5.0","0.0","0.0","0.0","0.8","1.0","1.6","2.0","3.0","3.0"][i]}"></td></tr>`).join("")}
    </table>
    <h2 style="margin-top:14px">Observações</h2>
    <textarea class="campo" rows="3" placeholder="Observações do dia"></textarea>
    <button class="acao" onclick="salvarTela(this, 'Leituras')">Salvar no histórico do app</button>
    <button class="acao" style="background:#555" onclick="verHistorico('Leituras')">Ver histórico de leituras</button>
    <div class="nota">Não gera texto para o grupo. Nível de 1 m ou menos aparece em Informações urgentes para todos.</div>`;
  },

  coelba: () => `
    <h2>Reclamação Coelba</h2>
    <div><label><input type="radio" name="cb_tipo" value="Qualidade"> Qualidade</label> &nbsp; <label><input type="radio" name="cb_tipo" value="Interrupção" checked> Interrupção</label></div>
    <select id="cb_cidade" class="campo"><option value="">Localidade…</option>${LOCALIDADES_COELBA.map(l => `<option>${l}</option>`).join("")}</select>
    <select id="cb_conta" class="campo" onchange="preencherContaCoelba()"><option value="">Conta contrato…</option><option value="|||">São Desidério (sem contrato)</option>${CONTRATOS_COELBA.map(([c, s, ci, e]) => `<option value="${c}|${s}|${ci}|${e}">${c} – ${s}</option>`).join("")}</select>
    <div id="cb_endereco" class="nota"></div>
    <input id="cb_nota" class="campo" placeholder="Nota de reclamação">
    <input id="cb_protocolo" class="campo" placeholder="Protocolo">
    <div class="nota">Data e hora do problema</div>
    <input type="datetime-local" id="cb_inicio" class="campo">
    <div class="nota">Data e hora da abertura</div>
    <input type="datetime-local" id="cb_abertura" class="campo">
    <select id="cb_obs" class="campo" onchange="document.getElementById('cb_obs_outra').style.display = this.value === 'Outra (digitar)' ? '' : 'none'"><option>Observação…</option><option>Sem energia</option><option>Cabo caído</option><option>Acidente no poste</option><option>Outra (digitar)</option></select>
    <input id="cb_obs_outra" class="campo" placeholder="Digite a observação" style="display:none">
    <button class="acao" onclick="gerarTextoCoelba()">Gerar texto para o grupo</button>
    <textarea id="cb_texto" class="campo" rows="6" placeholder="O texto aparece aqui para copiar"></textarea>
    <button class="acao" onclick="copiarTextoCoelba()">Copiar texto</button>`,

  quimicoAlimentar: () => `
    <h2>Produto químico – alimentar o sistema</h2>
    <select id="qm_local" class="campo"><option value="">ETA…</option>${ETAS_QUIMICO.map(l => `<option>${l}</option>`).join("")}</select>
    <select id="qm_tipo" class="campo"><option>Retirada</option><option>Recebimento</option></select>
    <div class="nota">Retirada tira do estoque da ETA. Recebimento soma ao estoque.</div>
    <select id="qm_produto" class="campo" onchange="atualizarUnidadesQuimico()"><option value="">Produto…</option>${PRODUTOS_QUIMICO.map(p => `<option>${p}</option>`).join("")}</select>
    <input id="qm_qtd" class="campo" placeholder="Quantidade">
    <select id="qm_un" class="campo"><option value="">Escolha o produto primeiro</option></select>
    <div class="nota"><b>Quando foi a retirada ou o recebimento</b> (o dia e a hora em que usou ou recebeu o produto, não a hora de agora):</div>
    <input type="date" id="qm_dia" class="campo" value="${hojeISO()}">
    <input type="time" id="qm_hora" class="campo">
    <textarea id="qm_obs" class="campo" rows="2" placeholder="Observação"></textarea>
    <button class="acao" onclick="salvarQuimico()">Salvar no sistema</button>`,

  quimicoHistorico: () => `<div class="nota">Carregando histórico...</div>`,

  quimicoEstoque: () => `
    <h2>Estoque de produto químico</h2>
    <select id="qe_local" class="campo" onchange="mostrarEstoqueQuimico()">${opcoesEtaPessoa(true)}</select>
    <select id="qe_produto" class="campo" onchange="mostrarEstoqueQuimico()"><option value="">Produto…</option>${PRODUTOS_QUIMICO.map(p => `<option>${p}</option>`).join("")}</select>
    <div id="qe_saldo" class="nota"></div>
    <button class="acao" onclick="mostrarEstoqueQuimico()">Consultar</button>`,

  nivelHistorico: () => `<div class="nota">Carregando histórico...</div>`,
  nivelHistSD: () => telaNivelHist("sd"),
  nivelHistAngico: () => telaNivelHist("angico"),
  nivelHistMozondo: () => telaNivelHist("mozondo"),

  macrosMozondo: () => `
    <h2>Alimentar planilha dos macros – ETA Mozondó</h2>
    <input type="date" class="campo" value="${hojeISO()}">
    <div class="card" style="margin-bottom:10px"><b>Macro saída da ETA</b>
      <input id="ms_leitura" class="campo" placeholder="Leitura 7h (m³)" oninput="calcularConsumosMozondo()">
      <input id="ms_consumo" class="campo" readonly placeholder="Consumo 24h (automático)">
    </div>
    <div class="card" style="margin-bottom:10px"><b>Macro Buriti Cortado</b>
      <input id="bc_leitura" class="campo" placeholder="Leitura 7h (m³)" oninput="calcularConsumosMozondo()">
      <input id="bc_consumo" class="campo" readonly placeholder="Consumo 24h (automático)">
    </div>
    <button class="acao" onclick="salvarTela(this, 'Leituras')">Salvar macros</button>`,

  macrosSD: () => macroHTML("Alimentar planilha dos macros – São Desidério", "Macro saída da ETA", "SD – Macro saída da ETA"),

  macrosAngico: () => macroHTML("Alimentar planilha dos macros – Angico", "Saída da ETA", "ANG – Saída da ETA"),

  escalaMozondo: () => {
    const meses = [];
    for (let a = 2026; a <= 2027; a++) {
      for (let m = 0; m < 12; m++) {
        if (a === 2026 && m < 10) continue;
        meses.push([a, m]);
      }
    }
    return `<h2>Escala de turno – ETA Mozondó</h2>
      <div class="grid">${meses.map(([a, m]) => `<button class="btn" onclick="mostrarEscalaMes(${a}, ${m})">${NOMES_MESES[m]} ${a}</button>`).join("")}</div>
      <div id="escala_mes"></div>`;
  },

  busca: () => `
    <h2>Buscar cliente</h2>
    <input class="campo" placeholder="Matrícula">
    <input class="campo" placeholder="Número do hidrômetro">
    <input class="campo" placeholder="Nome do cliente">
    <input class="campo" placeholder="Localidade, bairro ou logradouro (ajuda a filtrar)">
    <button class="acao">Pesquisar</button>
    <div class="nota">Depois de achar a matrícula, você escolhe: 2ª via, débitos ou análise de consumo.</div>`,

  meusPedidos: () => `
    <h2>Meus pedidos</h2>
    <h3>EPI</h3>
    <div id="mp_lista">Carregando...</div>`,


  solicitarSS: () => AVISO_DIGITINHO + telaPedidoSS(false),

  segundaVia: () => `
    <h2>Segunda via</h2>
    <input class="campo" placeholder="Matrícula, ou nome + localidade + bairro">
    <button class="acao">Buscar e gerar 2ª via</button>
    <div class="nota">Não abre SS. O escritório puxa a 2ª via direto no SCI.</div>`,

  debitos: () => `
    <h2>Débitos em atraso</h2>
    <input class="campo" placeholder="Matrícula ou nome">
    <button class="acao">Consultar e gerar PDF das faturas em atraso</button>
    <div class="nota">Exemplo: a tela mostra as faturas e você marca quais imprimir.</div>`,

  analiseConsumo: () => `
    <h2>Análise de consumo</h2>
    <input class="campo" placeholder="Matrícula">
    <input class="campo" placeholder="Número do hidrômetro">
    <button class="acao">Consultar últimas leituras</button>
    <button class="acao" style="background:#555">Consultar titularidade</button>`,

  extensaoRede: () => `
    <h2>Solicitação de extensão de rede</h2>
    <select class="campo" data-end-loc="er"><option value="">Localidade…</option>${LOCALIDADES_HORA_EXTRA.map(l => `<option>${l}</option>`).join("")}</select>
    <input class="campo" data-end-bairro="er" placeholder="Bairro">
    <input class="campo" data-end-log="er" placeholder="Logradouro">
    <input class="campo" placeholder="Quantidade de ligações beneficiadas">
    <input class="campo" placeholder="Metragem da extensão (opcional)">
    <input class="campo" placeholder="Quantidade de tubos">
    <select class="campo"><option>Tipo de abastecimento…</option><option>Rede de distribuição</option><option>Booster</option><option>Reservatório elevado</option><option>Reservatório apoiado</option></select>
    <select class="campo"><option>O cliente pode abrir a cava?</option><option>Sim</option><option>Não</option></select>
    <button class="acao">Gerar ESS para o Edivaldo</button>`,

  metasAngico: () => `
    <h2>Metas – ETA Angico</h2>
    <div class="cards">
      <div class="card"><b>IPD</b><br><span style="font-size:14px">Valor a ser informado pela gerência</span></div>
      <div class="card"><b>IQA</b><br><span style="font-size:14px">Valor a ser informado pela gerência</span></div>
    </div>`,

  metas: () => `
    <h2>Minhas metas</h2>
    <button class="acao" style="background:#b71c1c">Divergência nesta meta</button>
    <h3 style="margin-top:18px">SS da cesta e prazo de cada tipo</h3>

const EQUIPE_SD_PRIOR = ["luzenildo", "joaquim", "carlito", "francisco", "oseias", "igor", "acacio", "janiolima", "eduardo"];
function prioridadesDoUsuario() {
  const quem = normalizarNome(window.credenciais && window.credenciais.usuario) + " " + normalizarNome(window.nomeUsuario);
  const eu = (chaves) => chaves.some(c => quem.includes(c));
  return PRIORIDADES.filter(p => p.quem.some(k => k === "sd" ? eu(EQUIPE_SD_PRIOR) : eu([k])));
}
function telaPrioridades() {
  const hoje = hojeISO();
  const itens = prioridadesDoUsuario().sort((a, b) => a.dia.localeCompare(b.dia));
  if (!itens.length) return "";
  const data = d => d.split("-").reverse().join("/");
  return `<h3 style="color:#c62828">Prioridades de hoje e amanhã</h3>` + itens.map(p => {
    const vencida = p.dia < hoje;
    const cor = vencida || p.urgente ? "#c62828" : "#f9a825";
    const tag = vencida ? "VENCIDA" : p.dia === hoje ? "HOJE" : p.dia === somarDiasISO(hoje, 1) ? "AMANHÃ" : "";
    return `<div class="card" style="margin-bottom:10px;border-left:6px solid ${cor}">
      <b style="color:${cor}">${tag ? tag + " · " : ""}${data(p.dia)}</b>${p.urgente ? " · <b>URGENTE</b>" : ""}<br>
      <span style="font-size:15px">${p.texto}</span></div>`;
  }).join("");
}
function somarDiasISO(iso, n) {
  const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
function contarPrioridadesHoje() {
  const hoje = hojeISO(), amanha = somarDiasISO(hoje, 1);
  return prioridadesDoUsuario().filter(p => p.dia <= amanha).length;
}

// ===== TEXTO DO GRUPO: PRODUTOS QUÍMICOS (formato de Mozondó) =====
// Preenche o texto do grupo com o que está lançado no sistema (ETA Mozondó)
// Período: das 07h do dia anterior às 07h de hoje. Consumo = retiradas; recebido = recebimentos
// ETAs que a pessoa opera (a gerência vê todas)
function etasDaPessoa() {
  return ETAS_QUIMICO.filter(e => podeMovimentarAlmox(e));
}
// <option>s das ETAs da pessoa; com mais de uma (gerência) vem uma opção em branco antes
function opcoesEtaPessoa(comBranco) {
  const e = etasDaPessoa();
  return (comBranco && e.length > 1 ? '<option value="">ETA…</option>' : "") + e.map(l => `<option>${l}</option>`).join("");
}
function etaDoTextoQuimico() {
  return (document.getElementById("qmg_eta") || {}).value || etasDaPessoa()[0] || "";
}
async function carregarSaldosQuimicos() {
  const eta = etaDoTextoQuimico();
  if (!eta || !etasDaPessoa().includes(eta)) { alert("Você não tem uma ETA ligada ao seu usuário."); return; }
  const mapa = { cl: "Dicloro", su: "Sulfato", fl: "Flúor" };
  const acum = { cl: { ant: 0, rec: 0, cons: 0 }, su: { ant: 0, rec: 0, cons: 0 }, fl: { ant: 0, rec: 0, cons: 0 } };
  try {
    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Quimicos" });
    if (res.erro) { alert(res.erro); return; }
    // Dia operacional: das 07h do dia anterior às 07h de hoje (flúor: 48h, das 07h de anteontem)
    const fim = new Date(hojeISO() + "T07:00:00-03:00").getTime();
    res.dados.slice(1).map(linhaQuimico).forEach(l => {
      // colunas: data_hora, usuario, local, tipo, produto, quantidade, unidade, data_movimento, observacao
      if (l[2] !== eta) return;
      const pref = Object.keys(mapa).find(k => mapa[k] === l[4]);
      if (!pref) return;
      const quando = new Date(l[7] || l[0]);
      const t = isNaN(quando) ? 0 : quando.getTime(); // lançamento sem data válida entra no estoque anterior, nunca se perde
      const inicio = fim - 24 * 3600 * 1000;
      const q = (parseFloat(l[5]) || 0) * (l[6] === "Gramas" ? 0.001 : 1);
      const saida = l[3] === "Retirada" || l[3] === "Consumo";
      // tudo que é do período para cá entra como recebido/consumido (inclusive o que foi lançado depois das 07h
      // e o que ficou com data à frente): assim o Estoque Atual do texto é igual ao saldo do painel
      if (t < inicio) {
        acum[pref].ant += saida ? -q : q;
      } else if (saida) { acum[pref].cons += q; } else { acum[pref].rec += q; }
    });
  } catch (e) { alert("Não consegui carregar o estoque. Verifique a internet."); return; }
  Object.keys(mapa).forEach(pref => {
    const a = acum[pref];
    document.getElementById(pref + "_ant").value = Math.round(a.ant * 100) / 100;
    document.getElementById(pref + "_rec").value = Math.round(a.rec * 100) / 100;
    document.getElementById(pref + "_cons").value = Math.round(a.cons * 100) / 100;
  });
  const neg = Object.keys(mapa).filter(p => acum[p].ant < -0.001).map(p => mapa[p]);
  if (neg.length) alert("Atenção: o estoque do dia anterior de " + neg.join(", ") + " ficou negativo. Falta lançar o estoque inicial como Recebimento nessa ETA. Confira antes de enviar o texto.");
}

function gerarTextoQuimico() {
  const n = id => parseFloat(document.getElementById(id).value) || 0;
  const agora = new Date();
  const dataStr = agora.toLocaleDateString("pt-BR");
  const horaStr = agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

  // pref: prefixo dos campos; diasConsumo: 1 (24h) ou 2 (48h, flúor)
  const bloco = (nome, unidade, pref, diasConsumo) => {
    const ant = n(pref + "_ant"), rec = n(pref + "_rec"), cons = n(pref + "_cons");
    const atual = ant + rec - cons;
    const diario = cons / diasConsumo;
    const previsao = diario > 0 ? Math.floor(atual / diario) : "--";
    const rotuloCons = diasConsumo === 2 ? "Última 48h" : "Últimas 24h";
    return nome + "\n" +
      "1. Estoque do Dia Anterior: " + ant + " " + unidade + "\n" +
      "2. Quantidade Recebida (Últimas 24h): " + rec + " " + unidade + "\n" +
      "3. Consumo (" + rotuloCons + "): " + cons + " " + unidade + "\n" +
      "4. Estoque Atual: " + atual + " " + unidade + "\n" +
      "5. Previsão de Duração (com base no consumo atual): " + previsao + " dias";
  };

  const obs = document.getElementById("qm_obs_grupo").value || "Nenhuma";
  const texto = "Formulário Diário de Controle de Estoque de Produtos Químicos - " + etaDoTextoQuimico().toUpperCase() + "\n\n" +
    "Data: " + dataStr + "\n" +
    "Horário do Registro: " + horaStr + "\n\n" +
    bloco("Dicloro", "kg", "cl", 1) + "\n\n" +
    bloco("Sulfato", "kg", "su", 1) + "\n\n" +
    bloco("Flúor", "lts", "fl", 1) + "\n\n" +
    "Observações (caso haja anormalidades)\n" + obs + "\n\n" +
    "Colaborador Responsável pela informação.\n" + (window.nomeUsuario || "");
  document.getElementById("qm_texto").value = texto;
}

// ===== PRODUTO QUÍMICO: retirada, recebimento e consumo (aba Quimicos) =====
const ETAS_QUIMICO = ["ETA Angico", "ETA São Desidério", "ETA Mozondó"];
// Linhas antigas de químico foram gravadas sem data_hora e usuario (tudo 2 colunas para a esquerda): aqui voltam ao lugar
function linhaQuimico(l) { return ETAS_QUIMICO.includes(String(l[0] || "").trim()) ? ["", "", ...l.slice(0, 7)] : l; }
// Número digitado com vírgula ou ponto vira número de verdade (a planilha em português transformava "4.5" em data)
function numOuTexto(v) { const t = String(v == null ? "" : v).trim().replace(",", "."); return t !== "" && !isNaN(t) ? Number(t) : v; }
const PRODUTOS_QUIMICO = ["Dicloro", "Sulfato", "Flúor"];

// Estoque da ETA = recebimentos somados e retiradas subtraídas
async function mostrarEstoqueQuimico() {
  const local = document.getElementById("qe_local").value;
  const produto = document.getElementById("qe_produto").value;
  const box = document.getElementById("qe_saldo");
  if (!local || !produto) { box.textContent = "Escolha a ETA e o produto."; return; }
  if (!etasDaPessoa().includes(local)) { box.textContent = "Você só pode consultar o estoque da sua ETA."; return; }
  box.textContent = "Consultando estoque...";
  try {
    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Quimicos" });
    if (res.erro) { box.textContent = res.erro; return; }
    let saldo = 0, unidade = produto === "Flúor" ? "litros" : "kg", movs = 0;
    res.dados.slice(1).map(linhaQuimico).forEach(l => {
      // colunas: data_hora, usuario, local, tipo, produto, quantidade, unidade, data_movimento, observacao
      if (l[2] !== local || l[4] !== produto) return;
      // o saldo é mostrado em quilos: gramas são convertidas
      const q = (parseFloat(l[5]) || 0) * (l[6] === "Gramas" ? 0.001 : 1);
      movs++;
      // Retirada tira do estoque; Recebimento soma (linhas antigas de Consumo também tiram)
      saldo += (l[3] === "Retirada" || l[3] === "Consumo") ? -q : q;
    });
    box.textContent = "Estoque de " + produto + " na " + local + ": " + saldo + " " + unidade + " (" + movs + " movimentações registradas)";
  } catch (e) { box.textContent = "Não consegui consultar agora. Verifique a internet."; }
}

  return isNaN(d) ? String(v) : d.toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" });
}
function formatarQuando(v) {
  const d = new Date(v);
  return isNaN(d) ? String(v) : d.toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", dateStyle: "short", timeStyle: "short" });
}

// ===== ESCALA DE TURNO – ETA MOZONDÓ (alterna dia sim, dia não) =====
// Base: 02/11/2026 → diurno Genildo, noturno Juvenson. Dia seguinte: Alan e Valdesandro.
const BASE_ESCALA_MOZONDO = Date.UTC(2026, 10, 2);
const NOMES_MESES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

function turnoMozondo(ano, mes, dia) {
  const diff = Math.round((Date.UTC(ano, mes, dia) - BASE_ESCALA_MOZONDO) / 86400000);
  const par = ((diff % 2) + 2) % 2 === 0;
  return { diurno: par ? "Genildo" : "Alan", noturno: par ? "Juvenson" : "Valdesandro" };
}

function mostrarEscalaMes(ano, mes) {
  const total = new Date(Date.UTC(ano, mes + 1, 0)).getUTCDate();
  let linhas = "";
  for (let dia = 1; dia <= total; dia++) {
    const t = turnoMozondo(ano, mes, dia);
    const semana = new Date(Date.UTC(ano, mes, dia)).toLocaleDateString("pt-BR", { weekday: "short", timeZone: "UTC" });
    linhas += `<tr><td>${String(dia).padStart(2, "0")}/${String(mes + 1).padStart(2, "0")}</td><td>${semana}</td><td>${t.diurno}</td><td>${t.noturno}</td></tr>`;
  }
  document.getElementById("escala_mes").innerHTML = `<h2>${NOMES_MESES[mes]} de ${ano}</h2>` +
    `<table><tr><th>Dia</th><th>Semana</th><th>Diurno</th><th>Noturno</th></tr>${linhas}</table>`;
}

// ===== DEMANDAS AGERSA (cada um vê só a sua localidade) =====
// Localidades da Agersa que a pessoa atende, pelo cadastro AGERSA_EQUIPE (mesmo critério de quem recebe a demanda)
function localidadesAgersaDoUsuario() {
  const quem = identidadeAtual(); // na prévia da gerente, usa a pessoa escolhida
  // nome completo, ou primeiro nome quando ele não se repete no cadastro (ex.: Ivo Carlos -> ivo)
  const todos = Object.values(AGERSA_EQUIPE).flat();
  const primeiros = {};
  todos.forEach(n => { const p = normalizarNome(String(n).split(" ")[0]); primeiros[p] = (primeiros[p] || 0) + 1; });
  // Só o primeiro nome "Ivo" vale como apelido (login ivo); Jânio precisa do sobrenome para não confundir Jânio Lima com Jânio Gualberto
  const casa = n => { const k = normalizarNome(n); const p = normalizarNome(String(n).split(" ")[0]); return (k && quem.includes(k)) || (p === "ivo" && quem.includes("ivo")) || (p === "isaque" && quem.includes("isaac")); };
  return Object.keys(AGERSA_EQUIPE).filter(loc => AGERSA_EQUIPE[loc].some(casa));
}
function localidadeVisivel(local) {
  if (window.MODO_GERENTE && !emPrevia()) return true;
  return localidadesAgersaDoUsuario().some(l => l === local);
}
// Demanda Agersa: cada um vê só as demandas em que é responsável (sem responsável: as da localidade dele)
function agersaEhMinha(l, ehAngico) {
  if (window.MODO_GERENTE && !emPrevia()) return true;
  const quem = identidadeAtual();
  const resp = String(l[4] || "").split(/[,;\/]| e /).map(s => s.trim()).filter(Boolean);
  if (!resp.length) return ehAngico ? ["Angico", "Captação São Desidério"].includes(l[2]) : localidadeVisivel(l[2]);
  const todos = Object.values(AGERSA_EQUIPE).flat();
  const prim = n => normalizarNome(String(n).split(" ")[0]);
  return resp.some(n => {
    const k = normalizarNome(n), p = prim(n);
    const unico = todos.filter(t => prim(t) === p).length <= 1 && p !== "janio";
    return (k && quem.includes(k)) || (unico && p.length >= 3 && quem.includes(p)) || (p === "isaque" && quem.includes("isaac"));
  });
}

function telaMedicao() {
  return `<h2>Medição (consórcio)</h2>

async function registrarMedicao() {
  const servico = document.getElementById("md_servico").value.trim();
  const ss = document.getElementById("md_ss").value.trim();
  if (!servico || !ss) { alert("Informe o serviço e o número da SS."); return; }
  const arquivos = document.getElementById("md_fotos").files;
  let links = [];
  try {
    for (const arq of arquivos) {
      const base64 = await lerArquivoBase64(arq);
      const r = await chamarApi({ acao: "salvarFoto", usuario: window.credenciais.usuario, senha: window.credenciais.senha, base64: base64, tipo: arq.type, nome: arq.name });
      if (r.erro) { alert(r.erro); return; }
      links.push(r.url);
    }

    alert("Medição registrada.");
    renderAtual();
  } catch (e) { alert("Não consegui registrar: " + (e && e.message ? e.message : "resposta inválida do servidor") + ". Verifique a internet."); }
}
async function carregarMedicao() {
  const box = document.getElementById("md_lista");
  if (!box) return;
  box.textContent = "Carregando...";

    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Medicao" });

async function atualizarMedicao(linha) {
  const enc = document.getElementById("md_enc_" + linha).value;

// colunas da aba PedidoSS usadas aqui: 2 tipo, 4 localidade, 9 observação, 10 situação, 11 SS, 17 concluída, 18 foto anexada
async function carregarAlertaPrefeitura() {
  const box = document.getElementById("al_pref");
  if (!box) return;
  box.textContent = "Carregando...";
  try {
    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "PedidoSS" });
    if (res.erro) { box.textContent = res.erro; return; }
    const entregas = res.dados.slice(1).map((l, i) => ({ linha: i + 2, quando: l[0], quem: l[1], tipo: l[2], loc: l[4], obs: l[9] || "", situacao: l[10] || "", ss: l[11] || "", concluida: l[16] || "", foto: l[17] || "" }))

    const statusDe = loc => {
      const e = entregas.filter(x => x.loc === loc).pop();
      if (!e) return '<span class="tag t-alerta">Ainda não entregue</span>';
      return e.ss ? `<span class="tag t-ok">Entregue · SS nº ${e.ss}${e.concluida ? " · concluída: " + e.concluida : ""}${e.foto ? " · foto anexada: " + e.foto : ""}</span>`

    };

      box.innerHTML = ENTREGAS_PREFEITURA.map(g => `<div class="card" style="margin-bottom:8px"><b>${g.loc}</b><br>${statusDe(g.loc)}</div>`).join("");
      return;
    }
    const grupo = grupoEntregaPrefeitura();
    if (!grupo) { box.innerHTML = "<p>Nenhum alerta para você.</p>"; return; }
    const hoje = hojeISO();
    box.innerHTML = `<div class="card" style="border-left:6px solid #c62828;margin-bottom:10px">

      <span style="font-size:14px">${grupo.loc}</span><br>
      <span style="font-size:14px">Situação: ${statusDe(grupo.loc)}</span>

        <label>Foto do recebido <input type="file" id="ent_fotos" accept="image/*" multiple class="campo"></label>
        <button class="acao" onclick="enviarEntregaPrefeitura('${grupo.loc}')">Salvar e enviar à gerência</button>
      </div>
    </div>`;
  } catch (e) { box.textContent = "Não consegui carregar. Verifique a internet."; }
}
async function enviarEntregaPrefeitura(loc) {
  const data = document.getElementById("ent_data").value;

  const quem = document.getElementById("ent_quem").value.trim();

  // colunas: data_hora, usuario, tipo, especificacao, localidade, bairro, logradouro, matricula, hidrometro, observacao, situacao, ss, por, data, digiteam, fotos
  const linha = [new Date().toISOString(), window.credenciais.usuario, "61 – SERVICO LEITURA E ENTREGA", "1 – ENTREGA DE CONTA",
    loc, "", "", "", "", texto, "pendente", "", "", "", "", links.join(" ")];
  try {
    const res = await chamarApi({ acao: "gravarVarias", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "PedidoSS", linhas: [linha] });

    alert("Entrega enviada à gerência. Ela aparece para o Thiago e para a Deyse.");
    carregarAlertaPrefeitura();
  } catch (e) { alert("Não consegui enviar: " + (e && e.message ? e.message : "resposta inválida do servidor") + ". Verifique a internet."); }

const ABAS_BACKUP = ["Usuarios","Acessos","PedidoSS","HoraExtra","Rotina","Urgencias","EPI","AgersaEvidencia","Agersa","Ferramentas","RILC","RILCResposta","Conserto","Equipamentos","Niveis","Leituras","Quimicos","Almoxarifado","PedidoMaterial","Historico","Abastecimento","Medicao","EstadoSS","ServicosUrgentes","EncerrarSS","ExecucaoCampo","Metas","Ocorrencia","SSAbertas","AcaoSS"];
function telaBackup() {
  return `<h2>Gerar relatório (backup)</h2>
    <div class="nota">Gera um arquivo com todos os dados da planilha. Guarde esse arquivo antes de atualizar a versão do painel. Ele contém os dados de usuários, então não envie para ninguém.</div>
    <button class="acao" onclick="gerarBackup()">Gerar relatório agora</button>
    <div id="bk_status" style="margin-top:10px"></div>`;
}
async function gerarBackup() {
  const status = document.getElementById("bk_status");
  const pacote = { gerado_em: new Date().toISOString(), abas: {} };
  try {
    for (const aba of ABAS_BACKUP) {
      status.textContent = "Lendo " + aba + "...";
      const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: aba });
      pacote.abas[aba] = res.erro ? { erro: res.erro } : res.dados;
    }
    const blob = new Blob([JSON.stringify(pacote, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const data = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = "backup_painel_embasa_" + data + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    const linhas = Object.entries(pacote.abas).map(([k, v]) => `<li>${k}: ${v.erro ? "erro" : Math.max(0, v.length - 1) + " registro(s)"}</li>`).join("");
    status.innerHTML = "<b>Backup gerado.</b><ul>" + linhas + "</ul>";
  } catch (e) { status.textContent = "Não consegui gerar o backup. Verifique a internet."; }
}

// ===== Bairros e logradouros do SCI em todos os formulários (campos marcados com data-end-loc / data-end-bairro / data-end-log) =====
function endSciMontar(g) {
  const loc = document.querySelector(`[data-end-loc="${g}"]`);
  const bIn = document.querySelector(`[data-end-bairro="${g}"]`);
  const lIn = document.querySelector(`[data-end-log="${g}"]`);
  if (!loc || !bIn || !lIn) return;
  const lista = OC_LOGRADOUROS[loc.value];
  let bSel = document.getElementById("endsel_b_" + g), lSel = document.getElementById("endsel_l_" + g);
  if (!bSel) { bSel = document.createElement("select"); bSel.id = "endsel_b_" + g; bSel.className = "campo"; bIn.before(bSel);
    bSel.onchange = () => { bIn.value = bSel.value; endSciRuas(g); }; }
  if (!lSel) { lSel = document.createElement("select"); lSel.id = "endsel_l_" + g; lSel.className = "campo"; lIn.before(lSel);
    lSel.onchange = () => { lIn.value = lSel.value; }; }
  bIn.style.display = "none"; lIn.style.display = "none"; bIn.value = ""; lIn.value = "";
  if (!lista) { bSel.disabled = true; bSel.innerHTML = `<option value="">Escolha a localidade primeiro</option>`; endSciRuas(g); return; }
  bSel.disabled = false;
  bSel.innerHTML = `<option value="">Bairro…</option>${Object.keys(lista).map(b => `<option>${b}</option>`).join("")}`;
  endSciRuas(g);
}
function endSciRuas(g) {
  const loc = document.querySelector(`[data-end-loc="${g}"]`);
  const bIn = document.querySelector(`[data-end-bairro="${g}"]`);
  const lIn = document.querySelector(`[data-end-log="${g}"]`);
  const lSel = document.getElementById("endsel_l_" + g);
  const ruas = (OC_LOGRADOUROS[loc.value] || {})[bIn.value];
  lIn.style.display = "none"; lIn.value = "";
  if (!ruas) { lSel.disabled = true; lSel.innerHTML = `<option value="">Escolha o bairro primeiro</option>`; return; }
  lSel.disabled = false;
  lSel.innerHTML = `<option value="">Logradouro…</option>${ruas.map(r => `<option>${r}</option>`).join("")}`;
}
new MutationObserver(() => { document.querySelectorAll("[data-end-loc]").forEach(el => { const g = el.dataset.endLoc; if (!document.getElementById("endsel_b_" + g)) endSciMontar(g); }); }).observe(document.documentElement, { childList: true, subtree: true });
document.addEventListener("change", e => { const g = e.target && e.target.dataset && e.target.dataset.endLoc; if (g) endSciMontar(g); });
function ocDataLocal(d) { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 16); }
function ocAtualizarLocal() {
  const loc = document.getElementById("oc_loc").value;
  const unid = document.getElementById("oc_unid").value;
  const lista = OC_LOGRADOUROS[loc];
  const bbox = document.getElementById("oc_bairro_box");
  if (bbox && bbox.dataset.loc !== loc) {
    bbox.dataset.loc = loc;
    if (lista) bbox.innerHTML = `<select id="oc_bairro" class="campo" onchange="ocAtualizarLogradouros()"><option value="">Bairro…</option>${Object.keys(lista).map(b => `<option>${b}</option>`).join("")}</select>`;
    else bbox.innerHTML = `<select id="oc_bairro" class="campo" disabled><option value="">Escolha a localidade primeiro</option></select>`;
    ocAtualizarLogradouros();
  }
  const naEta = unid === "ETA" || unid === "Captação";
  if (naEta) document.getElementById("oc_todosb").checked = true;
  const afetadas = (naEta && OC_AFETADAS_MOZONDO.includes(loc)) ? OC_AFETADAS_MOZONDO : (loc ? [loc] : []);
  document.querySelectorAll(".oc_af").forEach(c => { if (afetadas.includes(c.value)) c.checked = true; });
  ocBairrosAfetados();
}

      ${bs.map(b => { const v = l + ": " + b; return `<label style="display:block"><input type="checkbox" class="oc_baf" data-loc="${l}" value="${v}" ${todosL || marcados.has(v) ? "checked" : ""} onchange="ocConferirTodosLoc('${l}')"> ${b}</label>`; }).join("")}</div>`;
  }).join("");
}
function ocMarcarTodosLoc(el) {

function ocConferirTodosLoc(l) {

function ocTextoBairrosAfetados() {

function ocAtualizarLogradouros() {

async function usarGPSOcorrencia() {

function ocFmt(v) { if (!v) return ""; const [d, h] = v.split("T"); const [a, m, dd] = d.split("-"); return `${dd}/${m}/${a} ${h}`; }

  const desc = [`Local do problema: ${unid}`, `Localidades afetadas: ${afet.join(", ")}`, `Bairros afetados: ${bairrosAf}`,
    `Início: ${ocFmt(ini)}`, `Previsão de fim: ${ocFmt(fim)}`, `Regularização: ${reg} horas`,
    obs.length ? `Observação: ${obs.join("; ")}` : "", outras ? `Outras informações: ${outras}` : ""].filter(Boolean).join("\n");
  try {

// Aba Ocorrencia: 1 data_hora | 2 usuario | 3 localidade | 4 endereco | 5 tipo | 6 descricao | 7 situacao (solicitada, aberta, finalizada, encerrada)
// 8 numero | 9 aberta_por | 10 termino_servico | 11 obs_termino | 12 encerrada_por | 13 data_encerramento | 14 alteracoes
const OC_OBS_FIM = ["Serviço concluído, abastecimento normalizado", "Energia restabelecida pela Coelba", "Vazamento eliminado", "Manutenção concluída", "Reservatórios recuperando o nível"];

function ocDescHtml(t) { return String(t || "").replace(/\n/g, "<br>"); }
function ocObsCampos(prefixo, opcoes) {
  return `<select id="${prefixo}_obs" class="campo"><option value="">Observação…</option>${opcoes.map(o => `<option>${o}</option>`).join("")}<option>Outra (escrever abaixo)</option></select>

function ocObsValor(prefixo) {

// Funcionário: ocorrências que ele pediu e já foram abertas, para informar o término (aparece em Serviços urgentes)
// Equipe da ETA de quem abriu a ocorrência: todos recebem em Serviços urgentes, porque podem restabelecer em outro plantão
function ocMesmaEquipe(quemAbriu) {
  const eta = etaDoOperador(identidadeAtual());
  const etaDeQuem = (Object.keys(ETAS_OPERADORES).find(k => ETAS_OPERADORES[k].nomes.some(x => normalizarNome(quemAbriu).includes(x))) || null);
  const eu = normalizarNome(window.credenciais.usuario);
  return normalizarNome(quemAbriu) === eu || (!!eta && eta === etaDeQuem);
}

// ===== SS PARA ACOMPANHAR: SS que vencem em 24 horas e SS abertas nos últimos 3 meses. A equipe escolhe e diz se manda ao Digiteam =====
// Aba SSAbertas (exportada do SCI pela gerência): ss | especificacao | localidade | abertura | vencimento | situacao
// Aba AcaoSS: data_hora | usuario | ss | especificacao | localidade | vencimento | acao | situacao
function dataSS(v) {
  const t = String(v || "").trim();
  const m = t.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?/);
  if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), Number(m[4] || 0), Number(m[5] || 0));
  const d = new Date(t);
  return isNaN(d) ? null : d;
}
function telaSSPrazo() {
  return `<h2>SS para acompanhar</h2>
    <div class="nota">Marque as SS e escolha o que fazer com elas. A gerência recebe a sua escolha.</div>
    <select id="sp_acao" class="campo"><option>Mandar no Digiteam</option><option>Não mandar no Digiteam</option></select>
    <button class="acao" onclick="enviarAcaoSS()">Enviar as marcadas</button>
    <h3>Vencem em até 24 horas</h3><div id="sp_24">Carregando...</div>
    <h3>Abertas nos últimos 3 meses</h3><div id="sp_90">Carregando...</div>`;
}
async function carregarSSPrazo() {
  const agora = new Date();
  const em24 = new Date(agora.getTime() + 24 * 3600 * 1000);
  const tres = new Date(agora.getTime() - 90 * 24 * 3600 * 1000);
  try {
    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "SSAbertas" });
    if (res.erro) { document.getElementById("sp_24").textContent = res.erro; return; }
    const linhas = res.dados.slice(1).map(l => ({ ss: String(l[0]), esp: l[1], loc: l[2], abertura: dataSS(l[3]), vencimento: dataSS(l[4]), situacao: l[5] || "" }))
      .filter(x => x.ss && !/encerrad|cancelad|conclu|saiu|escrit/i.test(x.situacao));
    const vencem = linhas.filter(x => x.vencimento && x.vencimento >= agora && x.vencimento <= em24).sort((a, b) => a.vencimento - b.vencimento);
    const abertas = linhas.filter(x => x.abertura && x.abertura >= tres).sort((a, b) => b.abertura - a.abertura);
    const tabela = (lista, campo) => lista.length ? lista.map(x => `<div class="card" style="margin-bottom:6px">
        <label><input type="checkbox" class="sp_sel" value="${x.ss}" data-esp="${String(x.esp).replace(/"/g, "")}" data-loc="${x.loc}" data-venc="${x.vencimento ? x.vencimento.toISOString() : ""}"> <b>SS ${x.ss}</b></label><br>
        <span style="font-size:14px">${x.esp} · ${x.loc}${x[campo] ? " · " + (campo === "vencimento" ? "vence" : "aberta") + " em " + x[campo].toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", dateStyle: "short", timeStyle: "short" }) : ""}</span>
      </div>`).join("") : "<p>Nenhuma SS.</p>";
    document.getElementById("sp_24").innerHTML = tabela(vencem, "vencimento");
    document.getElementById("sp_90").innerHTML = tabela(abertas, "abertura");
  } catch (e) { document.getElementById("sp_24").textContent = "Não consegui carregar. Verifique a internet."; }
}
async function enviarAcaoSS() {
  const marcadas = [...document.querySelectorAll(".sp_sel:checked")];
  if (!marcadas.length) { alert("Marque pelo menos uma SS."); return; }
  const acao = document.getElementById("sp_acao").value;
  const linhas = marcadas.map(c => [new Date().toISOString(), window.credenciais.usuario, c.value, c.dataset.esp, c.dataset.loc, c.dataset.venc, acao, "pendente"]);
  try {
    const res = await chamarApi({ acao: "gravarVarias", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "AcaoSS", linhas: linhas });
    if (res.erro) { alert(res.erro); return; }
    alert(linhas.length + " SS enviada(s) para a gerência: " + acao + ".");
    carregarSSPrazo();
  } catch (e) { alert("Não consegui enviar: " + (e && e.message ? e.message : "resposta inválida do servidor")); }
}

// 09/11: SS pedida para o escritório encerrar que NÃO veio no Excel do SCI (Pendências da unidade) importado depois do pedido
// já foi encerrada no sistema: sai da lista sozinha. Se ainda aparece em aberto na aba SSAbertas, continua.
// Pedidos de SS vencida / nova SS ficam (o escritório ainda precisa informar a nova SS).
function eeSairamDoExcel(eeLinhas, saDados, impDados) {
  const fechada = sit => /encerrad|cancelad|conclu|saiu/i.test(String(sit || ""));
  const abertas = new Set(), grupoDaSS = {};
  (saDados || []).slice(1).forEach(l => { const ss = String(l[0] || "").replace(/^'/, "").trim(); if (!ss) return;
    if (!fechada(l[5])) abertas.add(ss);
    const g = String(l[13] || "").replace(/^(Vencidas|Escritório)\s+/, "").trim(); if (g) grupoDaSS[ss] = g; });
  const imp = {}; (impDados || []).slice(1).forEach(l => { if (l[0] && !/^erro/i.test(String(l[4] || ""))) imp[String(l[0]).trim()] = String(l[1] || ""); });
  const fora = new Set();
  (eeLinhas || []).forEach(x => {
    if ((x.situacao || "pendente") !== "pendente" || /\[VENCIDA\]|\[NOVA SS\]|\[NÃO EXECUTADO\]/.test(String(x.obs || ""))) return;
    const ss = String(x.ss || "").replace(/^'/, "").trim(); if (!ss || abertas.has(ss)) return;
    const locN = normalizarNome(x.loc);
    const u = grupoDono("", x.loc) === "Catolândia" ? "Catolândia" : (SCI_GRUPOS_BOTAO.find(g => normalizarNome(g) === locN) || grupoDaSS[ss] || "");
    const t = imp[u]; if (!u || !t) return;
    const tImp = new Date(t).getTime(), tPed = new Date(x.quando).getTime();
    if (tImp && tPed && tImp > tPed) fora.add(x.linha);
  });
  return fora;
}
async function carregarEncerrarEscritorio(boxId = "ee_lista") {
  const box = document.getElementById(boxId);

  box.textContent = "Carregando...";
  const quemEncerra = normalizarNome(window.credenciais && window.credenciais.usuario) + " " + normalizarNome(window.nomeUsuario);
  const gerencia = window.MODO_GERENTE || ["thiago", "igor", "oseias", "alan", "genildo"].some(n => quemEncerra.includes(n));
  try {
    const credEE = { usuario: window.credenciais.usuario, senha: window.credenciais.senha };
    const [res, saEE, istEE] = await Promise.all([chamarApi({ acao: "listar", ...credEE, aba: "EncerrarSS" }),
      chamarApi({ acao: "listar", ...credEE, aba: "SSAbertas" }).catch(() => ({ dados: [] })), chamarApi({ acao: "listar", ...credEE, aba: "ImportSCIStatus" }).catch(() => ({ dados: [] }))]);
    if (res.erro) { box.textContent = res.erro; return; }
    const todasEE = res.dados.slice(1).map((l, i) => ({ linha: i + 2, quando: l[0], quem: l[1], ss: l[2], serv: l[3], loc: l[4], obs: l[5], situacao: l[6] || "pendente", por: l[7] || "", fotos: l[9] || "" }));

    const saiuEE = todasEE.filter(x => foraEE.has(x.linha));

    const bAn = document.getElementById("ee_btn_anexar"); if (bAn) bAn.textContent = "Anexar documento à SS já encerrada (" + qAnexar + ")";
    const itens = todasEE.filter(x => x.situacao === "pendente" && !foraEE.has(x.linha)).reverse();
    const notaSaiu = saiuEE.length ? `<details class="nota" style="margin-bottom:8px"><summary>✔ ${saiuEE.length} SS saíram desta lista porque não vieram mais no Excel do SCI (já encerradas no sistema)</summary>${saiuEE.map(x => "SS " + String(x.ss).replace(/^'/, "") + " · " + sspEsc(x.serv) + " · " + sspEsc(x.loc)).join("<br>")}</details>` : "";
    box.innerHTML = notaSaiu + (itens.length ? `<div class="nota">${itens.length} SS para encerrar</div>` + itens.map(x => `<div class="card" style="margin-bottom:8px;border-left:6px solid #c62828">

      ${gerencia && /\[VENCIDA\]|\[NOVA SS\]/.test(String(x.obs)) ? `<br><input id="ee_nova_${x.linha}" class="campo" placeholder="Número da NOVA SS gerada">

        : gerencia ? `<br><button class="acao" onclick="marcarEncerrada(${x.linha})">Concluída no sistema</button>` : ""}
    </div>`).join("") : "<p>Nenhuma SS pendente.</p>");

// Aba AcaoSS: data_hora | usuario | ss | tipo | localidade | data_para_digiteam | acao | situacao ("pendente" / "feito" com acao "feito:<id do grupo>")
function lerPedidosDigiteam(acsDados, saDados) {
  const linhas = (acsDados || []).slice(1);
  const sa = {}; (saDados || []).slice(1).forEach(l => { sa[String(l[0]).replace(/^'/, "").trim()] = { bairro: String(l[9] || "").replace(/^\d+\s*-\s*/, "").trim(), abertura: String(l[3] || "") }; });
  const feitos = {}; linhas.filter(l => l[7] === "feito").forEach(l => { feitos[String(l[6]).replace(/^feito:/, "")] = { por: l[1], em: l[0] }; });
  const lotes = {};
  linhas.filter(l => l[7] === "pendente" && /Digiteam/i.test(String(l[6])) && !/Não mandar/i.test(String(l[6]))).forEach(l => {
    const tipo = String(l[3] || "Sem tipo").replace(/^\s*\d+\s*-\s*/, "").trim().toUpperCase();
    const grupo = String(l[0]) + "|" + l[1] + "|" + tipo + "|" + l[4], chave = String(l[0]) + "|" + l[1];
    const p = lotes[chave] = lotes[chave] || { chave, quando: l[0], quem: l[1], data: l[5] || "", ss: [], tipos: new Set(), locs: new Set(), bairros: {}, grupos: new Set(), desde: "", feitoPor: "", feitoEm: "" };
    const ss = String(l[2]).replace(/^'/, "").trim(); p.ss.push(ss); p.tipos.add(tipo); p.locs.add(String(l[4]).trim()); p.grupos.add(grupo);
    const inf = sa[ss] || {}; if (inf.bairro) p.bairros[inf.bairro] = (p.bairros[inf.bairro] || 0) + 1;
    const d = dataSS(inf.abertura); if (d && (!p.desdeD || d < p.desdeD)) { p.desdeD = d; p.desde = d.toLocaleDateString("pt-BR"); }
  });
  return Object.values(lotes).map(p => { const f = [...p.grupos].map(g => feitos[g]).filter(Boolean); p.feito = f.length === p.grupos.size; if (f.length) { p.feitoPor = f[0].por; p.feitoEm = f[0].em; } return p; })
    .sort((a, b) => String(b.quando).localeCompare(String(a.quando)));
}

// Lê o Excel do SCI (é uma página HTML com a tabela) e devolve { linhas, faltam, dataFiltro, locs }
function lerExcelSCI(texto, cols = SCI_COLUNAS, obrig = SCI_OBRIGATORIAS, chaveCol = 0) {
  const doc = new DOMParser().parseFromString(texto, "text/html");
  const tabs = [...doc.querySelectorAll("table")]; if (!tabs.length) return null;
  const tab = doc.getElementById("form-grid-grid") || [...tabs].sort((a, b) => b.rows.length - a.rows.length)[0];
  const ths = [...tab.querySelectorAll("thead th")].map(t => t.textContent.replace(/\s+/g, " ").trim());
  const idx = n => { const a = normalizarNome(n); let k = ths.findIndex(t => normalizarNome(t) === a);
    if (k < 0 && a.length >= 2) k = ths.findIndex(t => normalizarNome(t).startsWith(a)); // aceita "Tipo da Solicitação", "SS Nº" etc.
    if (k < 0 && a === "ss") k = ths.findIndex(t => ["solicitacao", "numerodass", "numerodasolicitacao", "nss"].includes(normalizarNome(t)));
    if (k < 0 && a === "tipo") k = ths.findIndex(t => ["servico", "tipodeservico", "tiposervico"].includes(normalizarNome(t))); // o SCI às vezes chama a coluna Tipo de "Serviço"
    if (k < 0 && a === "previsaoinicial") k = ths.findIndex(t => /^(previsao|prevista|vencimento|prazo)/.test(normalizarNome(t))); // prazo da SS (contagem regressiva)
    if (k < 0 && a === "geracaodass") k = ths.findIndex(t => /^(geracao|abertura|datadeabertura|dataabertura)/.test(normalizarNome(t)));
    return k; };
  const faltam = obrig.filter(n => idx(n) < 0);
  const linhas = [...tab.querySelectorAll("tbody tr")].map(tr => { const tds = [...tr.children];
    return cols.map(n => { const k = idx(n); return k >= 0 && tds[k] ? tds[k].textContent.replace(/\s+/g, " ").trim() : ""; }); })
    .filter(l => /^\d{6,}$/.test(l[chaveCol]));
  const filtro = tabs[0] !== tab ? [...tabs[0].querySelectorAll("td")].map(t => t.textContent.trim()) : [];
  const kd = filtro.indexOf("data");
  const locs = {}; linhas.forEach(l => { const n = normalizarNome(l[5].replace(/^\d+\s*-\s*/, "")); locs[n] = (locs[n] || 0) + 1; });
  return { linhas, faltam, dataFiltro: kd >= 0 ? filtro[kd + 1] || "" : "", locs, ncols: ths.length };
}
// Lê o arquivo do SCI: HTML (como o SCI exporta) ou Excel salvo de novo (.xlsx), que é convertido para a mesma tabela.
async function sciTextoDoArquivo(arq) {
  const buf = await arq.arrayBuffer();
  const b0 = new Uint8Array(buf, 0, Math.min(400, buf.byteLength));
  const utf16 = (b0[0] === 0xFF && b0[1] === 0xFE) || [...b0].filter((x, i) => i % 2 === 1 && x === 0).length > b0.length / 4; // 10/11: Excel/HTML em UTF-16
  let texto = new TextDecoder(utf16 ? "utf-16le" : "utf-8").decode(buf);
  if (!utf16 && /\uFFFD/.test(texto) && /<table/i.test(texto)) texto = new TextDecoder("latin1").decode(buf);
  if (/<table/i.test(texto)) return texto;
  const esc = v => String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const ehSS = c => ["ss", "solicitacao", "numerodass", "numerodasolicitacao", "nss", "ssn"].includes(normalizarNome(c)) || /^numerodasolicitacao/.test(normalizarNome(c));
  let rows = null;
  const b = new Uint8Array(buf, 0, 4);
  const binario = (b[0] === 0x50 && b[1] === 0x4B) || (b[0] === 0xD0 && b[1] === 0xCF); // .xlsx ou .xls antigo
  if (binario) {
    if (!window.XLSX) await new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
    const wb = XLSX.read(buf, { type: "array" });
    rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "", raw: false });
  } else {
    // 10/11: CSV / texto (separado por ; , ou tabulação), inclusive copiado da tela do SCI
    const t = /\uFFFD/.test(texto) ? new TextDecoder("latin1").decode(buf) : texto;
    rows = t.split(/\r?\n/).map(l => l.split(/\t|;/).length > 1 ? l.split(/\t|;/) : l.split(","));
  }
  if (!rows || !rows.length) return texto;
  let h = rows.findIndex(r => r.some(c => String(c).trim() === "SS") && r.some(c => String(c).trim() === "Tipo"));
  if (h < 0) h = rows.findIndex(r => r.some(c => ehSS(c)));
  if (h >= 0) { const cab = rows[h];
    return "<table><thead><tr>" + cab.map(c => "<th>" + esc(c) + "</th>").join("") + "</tr></thead><tbody>" +
      rows.slice(h + 1).map(r => "<tr>" + cab.map((_, i) => "<td>" + esc(r[i] ?? "") + "</td>").join("") + "</tr>").join("") + "</tbody></table>"; }
  // 10/11: sem cabeçalho reconhecido – o importante são as SS: pega o primeiro número de 10 dígitos de cada linha
  const sss = []; rows.forEach(r => { const m = r.join(" ").match(/\b10\d{8}\b/); if (m && !sss.includes(m[0])) sss.push(m[0]); });
  if (!sss.length) return texto;
  return "<table><thead><tr><th>SS</th></tr></thead><tbody>" + sss.map(x => "<tr><td>" + x + "</td></tr>").join("") + "</tbody></table>";
}
async function enviarExcelInativas(inp) {

  const x = /<table/i.test(texto) ? lerExcelSCI(texto, INAT_COLUNAS, INAT_OBRIGATORIAS, 2) : null;
  if (!x) { alert("Esse arquivo não é o Excel do SCI. Envie o arquivo exatamente como o SCI baixou (Consulta Avançada de Matrículas › Exportar para Excel)."); return; }
  if (x.faltam.length) { alert("Faltam colunas no Excel: " + x.faltam.join(", ") + ".\n\nNo SCI, marque as colunas da lista desta tela e exporte de novo."); return; }

  await sciEnviarLinhas("Inativas", x.linhas, x.linhas.length + " matrículas inativas");
}
async function sciEnviarLinhas(g, linhas, rotulo) {
  const partes = []; let atual = [], tam = 2;

// ===== PRAZOS DAS SS (a partir da data de abertura) =====
// Transferência de ramal/HD 72h · corte a pedido 48h · ligação nova 10 dias úteis · religação 24h · vazamento (qualquer) 24h
function regraPrazoSS(tipo) {
  const t = String(tipo || "").toUpperCase();
  if (/\bVAZ/.test(t)) return { horas: 24, texto: "24h (vazamento)" };
  if (/RELIG|RESTAB/.test(t)) return { horas: 24, texto: "24h (religação)" };
  if (/TRANS/.test(t)) return { horas: 72, texto: "72h (transferência de ramal/HD)" };
  if (/CORTE/.test(t) && /PEDIDO/.test(t)) return { horas: 48, texto: "48h (corte a pedido)" };
  if (/LIG(ACAO)?\s*NOVA|LIGACAO DE AGUA|NOVA LIG/.test(t)) return { uteis: 10, texto: "10 dias úteis (ligação nova)" };
  return null;
}
function prazoSS(tipo, abertura, venc) {
  // Vencimento do SCI (data da Previsão Inicial + hora da Geração da SS) vale para qualquer tipo
  const mv = String(venc || "").match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
  if (mv) { const fimS = new Date(Number(mv[3]), Number(mv[2]) - 1, Number(mv[1]), Number(mv[4]), Number(mv[5])); return { vencida: new Date() > fimS, fim: fimS, texto: "prazo do SCI", sci: true }; }
  const r = regraPrazoSS(tipo);
  const m = String(abertura || "").match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?/);
  if (!r || !m) return null;
  const ini = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]), Number(m[4] || 0), Number(m[5] || 0));
  let fim = new Date(ini);
  if (r.horas) fim = new Date(ini.getTime() + r.horas * 3600e3 + (m[4] ? 0 : 24 * 3600e3 - 60e3)); // sem hora: conta a partir do fim do dia da abertura
  else { let d = 0; while (d < r.uteis) { fim.setDate(fim.getDate() + 1); if (fim.getDay() !== 0 && fim.getDay() !== 6) d++; } fim.setHours(23, 59); }
  return { vencida: new Date() > fim, fim, texto: r.texto };
}

async function enviarSSLista() {

  if (acao === "Mandar no Digiteam" && document.getElementById("sl_data") && !dataDigi) { alert("Escolha a data para o Digiteam."); return; }

}

// ===== SERVIÇOS URGENTES: a gerência adiciona; cada pessoa vê a quantidade no botão e marca como feito =====
// Aba ServicosUrgentes: data_hora | usuario | para | descricao | situacao | feito_por | data_feito
window.qtdUrgentes = 0;
function nomesDoUsuario() {
  return identidadeAtual();
}
function servicoParaMim(para) {
  const p = normalizarNome(para);
  if (String(para).trim().toLowerCase() === "todos") return true;
  const eu = nomesDoUsuario();
  return String(para).split(",").some(n => normalizarNome(n) && eu.includes(normalizarNome(n)));
}
// 09/11: demanda urgente com validação da gerência. Situação: pendente -> feito (aguardando validação) -> validado; ou devolvido (volta para o funcionário).
function urgItens(dados) {
  const linhas = (dados || []).slice(1).map((l, i) => ({ l, linha: i + 2 }));
  const excluidas = new Set(); linhas.forEach(({ l }) => { if (l[2] === "__controle__") { const m = String(l[3] || "").match(/^excluido:(\d+)$/); if (m) excluidas.add(Number(m[1])); } });
  const ctrl = {}; linhas.forEach(({ l }) => { if (l[2] !== "__controle__") return; const m = String(l[3] || "").match(/^(validado|devolvido):(\d+)(?::(.*))?$/); if (!m) return;
    const k = Number(m[2]); if (!ctrl[k] || String(l[0]) > String(ctrl[k].quando)) ctrl[k] = { acao: m[1], quando: String(l[0]), por: l[1], obs: m[3] || "" }; });
  // 09/11: gerência muda para quem vai a demanda (linha de controle "para:<linha>:<nomes>"; vale a mais recente)
  const novoPara = {}; linhas.forEach(({ l }) => { if (l[2] !== "__controle__") return; const m = String(l[3] || "").match(/^para:(\d+):(.+)$/); if (!m) return;
    const k = Number(m[1]); if (!novoPara[k] || String(l[0]) > novoPara[k].q) novoPara[k] = { q: String(l[0]), para: m[2] }; });
  return linhas.filter(({ l, linha }) => l[2] !== "__controle__" && l[3] && !excluidas.has(linha)).map(({ l, linha }) => {
    const x = { linha, quando: l[0], quem: l[1], para: novoPara[linha] ? novoPara[linha].para : l[2], desc: l[3], situacao: l[4] || "pendente", feito: l[5] || "", dataFeito: String(l[6] || "") };
    const c = ctrl[linha];
    if (x.situacao === "feito") x.estado = c && c.quando > x.dataFeito ? (c.acao === "validado" ? "validado" : "devolvido") : "aguardando";
    else x.estado = "pendente";
    x.ctrl = c; return x;
  });
}
const urgAberta = x => x.estado === "pendente" || x.estado === "devolvido";

// colunas da aba AgersaEvidencia: data_hora, usuario, localidade, demanda, url, situacao, validada_por, data_validacao
async function carregarAgersaGerente() {
  const box = document.getElementById("ag_ger");
  if (!box) return;
  const filtro = (document.getElementById("ag_loc") || {}).value || "";
  box.textContent = "Carregando...";
  try {
    const [dem, fot] = await Promise.all([
      chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Agersa" }),
      chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "AgersaEvidencia" })
    ]);
    if (dem.erro || fot.erro) { box.textContent = dem.erro || fot.erro; return; }
    const demandas = dem.dados.slice(1).map((l, i) => ({ linha: i + 2, local: l[2], demanda: l[3], resp: l[4], situacao: l[5], quando: l[0] }))
      .filter(d => !/cancelad/i.test(String(d.situacao || ""))).filter(d => !filtro || d.local === filtro);
    window.agersaDemandas = demandas;
    const fotos = fot.dados.slice(1).map((l, i) => ({ linha: i + 2, quando: l[0], quem: l[1], local: l[2], demanda: l[3], url: l[4], situacao: l[5] || "aguardando validação", por: l[6] || "" }))
      .filter(f => !filtro || f.local === filtro);
    const contaFotos = d => fotos.filter(f => f.local === d.local && f.demanda === d.demanda);
    const demHTML = demandas.length ? `<table><tr><th>Localidade</th><th>Demanda</th><th>Responsável</th><th>Situação</th><th>Fotos</th><th>Validadas</th><th></th></tr>` +
      demandas.map(d => {
        const f = contaFotos(d);
        return `<tr><td>${d.local}</td><td>${d.demanda}</td><td>${d.resp || "--"}</td><td>${d.situacao || "--"}</td><td>${f.length}</td><td>${f.filter(x => x.situacao === "validada").length}</td><td>${window.MODO_GERENTE && !emPrevia() ? `<button onclick="cancelarDemandaAgersa(${d.linha})" style="background:#c62828;color:#fff;border:none;border-radius:6px;padding:4px 8px">Cancelar</button>` : ""}</td></tr>`;
      }).join("") + "</table>" : "<p>Nenhuma demanda.</p>";
    const fotosHTML = fotos.length ? fotos.slice().reverse().map(f => {
      const cor = f.situacao === "validada" ? "#2e7d32" : f.situacao === "não validada" ? "#c62828" : "#f9a825";
      return `<div class="card" style="border-left:6px solid ${cor};margin-bottom:8px">
        <b>${f.demanda}</b> · ${f.local}<br>
        <span style="font-size:14px">Enviada por ${f.quem} em ${formatarQuando(f.quando)} · ${f.situacao}${f.por ? " por " + f.por : ""}</span><br>
        <a href="${f.url}" target="_blank">Ver foto</a>
        <button class="acao" style="margin:6px 0 0 0;padding:6px" onclick="validarFotoAgersa(${f.linha}, 'validada')">Validado</button>
        <button class="acao" style="margin:6px 0 0 6px;padding:6px;background:#555" onclick="validarFotoAgersa(${f.linha}, 'não validada')">Recusado</button>
      </div>`;
    }).join("") : "<p>Nenhuma foto enviada.</p>";
    box.innerHTML = `<h3>Demandas</h3>${demHTML}<h3>Fotos de evidência</h3>${fotosHTML}`;
  } catch (e) { box.textContent = "Não consegui carregar. Verifique a internet."; }
}
async function validarFotoAgersa(linha, situacao) {
  try {
    const res = await chamarApi({ acao: "validarEvidencia", usuario: window.credenciais.usuario, senha: window.credenciais.senha, linha: linha, situacao: situacao });
    if (res.erro) { alert(res.erro); return; }
    carregarAgersaGerente();

}

async function carregarAgersa() {
  const box = document.getElementById("ag_lista");
  if (!box) return;
  try {
    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Agersa" });
    if (res.erro) { box.innerHTML = `<p>${res.erro}</p>`; return; }
    // colunas: data_hora, usuario, localidade, demanda, responsavel, situacao
    // Ramon e Renato veem só as demandas do Angico e da Captação São Desidério
    const ehAngico = String(perfilAtual || "").startsWith("Operador Angico");
    const minhas = res.dados.slice(1).filter(l => !/cancelad/i.test(String(l[5] || ""))).filter(l => agersaEhMinha(l, ehAngico));
    box.innerHTML = minhas.length === 0 ? '<div class="nota">Nenhuma demanda sob sua responsabilidade.</div>' :
      minhas.map(l => `
        <div class="card" style="margin-bottom:10px">
          <b>${l[3]}</b><br>
          <span style="font-size:14px">${l[2]} · Responsável: ${l[4] || "--"} · Situação: ${l[5] || "--"}</span>
          <div class="nota" id="ag_status_${minhas.indexOf(l)}">Fotos: carregando situação...</div>
          <div class="nota">Fotos de evidência (inclua as fotos do local: cerca toda, vários ângulos, limpeza)</div>
          <input type="file" accept="image/*" multiple id="ag_foto_${minhas.indexOf(l)}" class="campo">
          <button class="acao" onclick="enviarEvidenciaAgersa(${minhas.indexOf(l)}, '${l[2]}', '${String(l[3]).replace(/'/g, "")}')">Enviar evidências</button>
        </div>`).join("");
    window.agersaMinhas = minhas;
    // situação das fotos já enviadas por demanda
    const fot = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "AgersaEvidencia" });
    if (!fot.erro) {
      const linhasFoto = fot.dados.slice(1);
      minhas.forEach((l, i) => {
        const dos = linhasFoto.filter(f => f[2] === l[2] && f[3] === l[3]);
        const val = dos.filter(f => f[5] === "validada").length;
        const nao = dos.filter(f => f[5] === "não validada").length;
        const el = document.getElementById("ag_status_" + i);
        if (el) el.textContent = "Fotos enviadas: " + dos.length + " · validadas: " + val + " · recusadas: " + nao + " · aguardando: " + (dos.length - val - nao);
      });
    }
  } catch (e) { box.innerHTML = '<div class="nota">Não consegui carregar. Verifique a internet.</div>'; }
}

async function enviarEvidenciaAgersa(indice, local, demanda) {
  const arquivos = document.getElementById("ag_foto_" + indice).files;
  if (!arquivos.length) { alert("Escolha as fotos."); return; }
  if (arquivos.length < 5) { alert("Envie pelo menos 5 fotos evidenciando o serviço. Você escolheu " + arquivos.length + "."); return; }
  try {
    for (const arquivo of arquivos) {
      const base64 = await lerArquivoBase64(arquivo);
      const r = await chamarApi({ acao: "salvarFoto", usuario: window.credenciais.usuario, senha: window.credenciais.senha,
        base64: base64, tipo: arquivo.type, nome: arquivo.name });
      if (r.erro) { alert(r.erro); return; }
      await chamarApi({ acao: "gravarVarias", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "AgersaEvidencia",
        linhas: [[new Date().toISOString(), window.credenciais.usuario, local, demanda, r.url]] });
    }
    alert("Evidências enviadas.");
  } catch (e) { alert("Não consegui enviar. Verifique a internet."); }
}

function lerArquivoBase64(arquivo) {
  return new Promise((resolver, rejeitar) => {
    const leitor = new FileReader();
    leitor.onload = () => resolver(String(leitor.result).split(",")[1]);
    leitor.onerror = rejeitar;
    leitor.readAsDataURL(arquivo);
  });
}

function marcaOrigemObra(sel) {
  const wrap = document.getElementById("enc_origem_wrap");
  if (!wrap) return;
  const sim = sel.value === "Sim";
  wrap.style.display = sim ? "" : "none";
  if (!sim) { const o = wrap.querySelector("select"); if (o) o.value = ""; }
}
function blocoEncerramento(chave) {
  const c = CAMPOS_ENCERRAMENTO[chave];
  if (!c) return "";
  return `<div class="card" style="border-left:6px solid #0a6e8a"><b>Dados obrigatórios para encerrar: ${c.titulo}</b>
    ${c.campos.map(([nome, tipo, condicao, padrao], i) => {
      const campo = Array.isArray(tipo)
        ? `<select id="enc_${i}" class="campo"${condicao === "pergunta_obra" ? ` onchange="marcaOrigemObra(this)"` : ""}><option value="">${nome}…</option>${tipo.map(o => `<option${o === padrao ? " selected" : ""}>${o}</option>`).join("")}</select>`
        : tipo === "numero"
        ? `<input id="enc_${i}" class="campo" type="number" inputmode="decimal" min="0" step="any" placeholder="${nome}">`
        : `<input id="enc_${i}" class="campo" placeholder="${nome}">`;
      if (condicao === "obra") return `<div id="enc_origem_wrap" style="display:none">${campo}</div>`;
      return campo;
    }).join("")}
  </div>`;
}

// 09/11: busca digitada nas listas de tipo e especificação – esconde o que não bate e, se sobrar uma opção, já escolhe
function filtrarSelect(id, texto) {
  const sel = document.getElementById(id); if (!sel) return;
  const q = normalizarNome(texto || "");
  const ops = [...sel.options].filter(o => o.value !== "");
  let vis = [];
  ops.forEach(o => { const ok = !q || normalizarNome(o.text).includes(q); o.hidden = !ok; o.disabled = !ok; if (ok) vis.push(o); });
  if (q && vis.length === 1 && sel.value !== vis[0].value) { sel.value = vis[0].value; sel.dispatchEvent(new Event("change")); }
  else if (q && vis.length && !vis.some(o => o.value === sel.value)) { sel.value = ""; }
}
function psAcaoMudou() {
  const enc = ((document.getElementById("ps_acao") || {}).value || "") === "Digitar e encerrar";
  const h = document.getElementById("ps_horas"); if (h) h.style.display = enc ? "" : "none";
  const e = document.getElementById("ps_enc"); if (e) e.style.display = enc && h ? "" : "none";
}

// Localização do aparelho (GPS). Usada no endereço e carimbada na foto da SS.
// Antes de pegar o GPS pergunta se a pessoa está no local do serviço (fora do local o GPS sairia errado).
// A resposta vale por 2 minutos, para não perguntar várias vezes na mesma ação.
function noLocalDoServico() {
  const d = window.__gpsDecisao;
  if (d && Date.now() - d.quando < 15000) return d.sim; // 09/11: pergunta a cada serviço (antes valia 2 minutos); 15s só evita perguntar duas vezes no mesmo envio
  const sim = confirm("Você está no local do serviço AGORA?\n\nOK = Sim, estou no local (registra o GPS)\nCancelar = Não, já saí / estou em casa ou no escritório (vai sem GPS)");
  window.__gpsDecisao = { quando: Date.now(), sim };
  return sim;
}
const semLocalEscolhido = () => !!(window.__gpsDecisao && Date.now() - window.__gpsDecisao.quando < 120000 && !window.__gpsDecisao.sim);
function obterPosicao() {
  if (!noLocalDoServico()) return Promise.resolve(null);
  const tentar = (alta, ms, idade) => new Promise(resolver => {
    if (!navigator.geolocation) return resolver(null);
    navigator.geolocation.getCurrentPosition(
      p => resolver({ lat: p.coords.latitude, lon: p.coords.longitude }),
      () => resolver(null),
      { enableHighAccuracy: alta, timeout: ms, maximumAge: idade });
  });
  // 20s com alta precisão e, se não vier, 15s sem alta precisão (sinal fraco em povoado e zona rural)
  return tentar(true, 20000, 60000).then(p => p || tentar(false, 15000, 300000));
}
async function usarGPSSS(btn) {
  if (btn) { btn.disabled = true; btn.dataset.txt = btn.textContent; btn.textContent = "Procurando o sinal do GPS… (até 35s)"; }
  const pos = await obterPosicao();
  if (btn) { btn.disabled = false; btn.textContent = btn.dataset.txt || "Usar minha localização (GPS)"; }
  if (!pos) { if (!semLocalEscolhido()) alert("Não consegui pegar a localização. Verifique se o GPS e a permissão do navegador estão ligados.\n\nVocê pode enviar o pedido sem a localização: escreva o ponto de referência no campo Logradouro."); return; }

  alert("Localização preenchida.");
}
// Carimba latitude e longitude na própria foto antes de enviar
function carimbarFoto(arquivo, pos) {
  return new Promise((resolver, rejeitar) => {
    const url = URL.createObjectURL(arquivo);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      const MAX = 1600, esc = Math.min(1, MAX / Math.max(img.width, img.height));
      c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0, c.width, c.height);
      if (!pos) { URL.revokeObjectURL(url); return resolver(c.toDataURL("image/jpeg", 0.8).split(",")[1]); }
      const altura = Math.max(40, Math.round(c.height * 0.06));
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(0, c.height - altura, c.width, altura);
      ctx.fillStyle = "#fff";
      ctx.font = "bold " + Math.round(altura * 0.45) + "px sans-serif";
      ctx.fillText("Lat " + pos.lat.toFixed(6) + "  Lon " + pos.lon.toFixed(6), 12, c.height - altura * 0.35);
      URL.revokeObjectURL(url);
      resolver(c.toDataURL("image/jpeg", 0.8).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); lerArquivoBase64(arquivo).then(resolver, rejeitar); };
    img.src = url;
  });
}

async function carregarPendExecutar() {

    const [res, base] = await Promise.all([
      chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "ExecucaoCampo" }),
      carregarBaseLocalizacao()

    if (res.erro) { box.textContent = res.erro; return; }
    const cab = res.dados[0] || [];
    const linhas = res.dados.slice(1);
    const eu = nomesDoUsuario();
    const executadas = new Set(linhas.filter(l => String(l[5]).toLowerCase() === "executada").map(l => String(l[1])));
    const idxMat = cab.findIndex(h => /matr/i.test(String(h)));
    const idxLocal = cab.findIndex((h, k) => k >= 7 && /localiza|coordenad|mapa|gps/i.test(String(h)));
    const matDaSS = {};

    const gpsPorMat = {};
    linhas.filter(l => String(l[5]).toLowerCase() === "executada").forEach(l => {
      const g = String(l[6] || "").match(/GPS:\s*(-?\d+\.\d+),(-?\d+\.\d+)/);
      const mat = matDaSS[String(l[1])];
      if (g && mat) gpsPorMat[mat] = g[1] + "," + g[2];
    });
    Object.keys(base).forEach(m => { if (!gpsPorMat[m]) gpsPorMat[m] = base[m]; });
    const diaDe = v => { const d = new Date(v); return isNaN(d) ? "" : d.toLocaleDateString("en-CA", { timeZone: "America/Bahia" }); };

        vencida: !!diaDe(l[0]) && diaDe(l[0]) < hojeBA, nova: diaDe(l[0]) === hojeBA,

    const distKm = (a, b) => { const R = 6371, t = x => x * Math.PI / 180; const dLa = t(b[0] - a[0]), dLo = t(b[1] - a[1]);
      const h = Math.sin(dLa / 2) ** 2 + Math.cos(t(a[0])) * Math.cos(t(b[0])) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
    const coordDe = x => { const p = String(x.gps || "").split(",").map(Number); return p.length === 2 && p.every(n => isFinite(n)) ? p : null; };

      ${(() => { const k = cab.findIndex(h => /hidrom/i.test(String(h))); return String(x.loc).trim() === "São Desidério" && !(k >= 0 && String(x.extras[k - 7] || "").trim()) ? `<div style="font-size:14px;color:#b71c1c">Sem número do HD</div>` : ""; })()}
