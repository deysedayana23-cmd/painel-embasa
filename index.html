<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo – Painel EMBASA</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f2f4f7; color: #1d2330; font-size: 17px; }
  header { background: #0b5394; color: #fff; padding: 14px 16px; }
  header h1 { margin: 0 0 8px; font-size: 18px; }
  select { width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: none; }
  .aviso-proto { background: #fff3cd; color: #6b4e00; padding: 8px 16px; font-size: 14px; border-bottom: 1px solid #e6d28a; }
  .aviso { background: #fff3cd; border-left: 6px solid #e0a800; padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 15px; }
  .urgente { background: #fde2e2; border-left: 6px solid #c62828; padding: 12px; border-radius: 8px; margin: 12px 0; }
  .vermelho { background: #c62828; color: #fff; padding: 12px; border-radius: 8px; margin: 12px 0; font-weight: 600; }
  main { padding: 12px 16px 40px; }
  .atualizado { font-size: 14px; color: #555; margin-bottom: 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { background: #fff; border: 1px solid #cfd6e0; border-radius: 12px; padding: 16px 10px; text-align: center; font-size: 16px; font-weight: 600; cursor: pointer; min-height: 72px; }
  .btn small { display: block; font-weight: 400; color: #555; font-size: 13px; margin-top: 4px; }
  .btn:active { background: #e8f0fb; }
  .voltar { background: none; border: none; color: #0b5394; font-size: 16px; padding: 8px 0; cursor: pointer; font-weight: 600; }
  h2 { font-size: 19px; margin: 8px 0 10px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; font-size: 14px; }
  th, td { padding: 8px; border-bottom: 1px solid #eef1f5; text-align: left; vertical-align: top; }
  th { background: #e9eef6; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .t-ok { background: #d8f3dc; color: #1b5e20; }
  .t-alerta { background: #fff3cd; color: #7a5a00; }
  .t-venc { background: #fde2e2; color: #b71c1c; }
  .campo { display: block; width: 100%; padding: 12px; font-size: 16px; border: 1px solid #cfd6e0; border-radius: 8px; margin: 6px 0 12px; background: #fff; }
  .acao { background: #0b5394; color: #fff; border: none; padding: 14px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: 600; margin-top: 8px; }
  .nota { font-size: 13px; color: #555; margin-top: 10px; }
  .cards { display: grid; gap: 8px; }
  .card { background: #fff; border-radius: 10px; padding: 12px; border: 1px solid #e3e8ef; }
</style>
</head>
<body>

<header>
  <h1>Painel EMBASA – Protótipo</h1>
  <select id="perfil" onchange="trocarPerfil()"></select>
  <button onclick="telaTrocarSenha()" style="margin-top:8px;background:#fff;color:#0b5394;border:none;border-radius:8px;padding:8px 12px;font-weight:600">Trocar minha senha</button>
</header>
<div class="aviso-proto">PROTÓTIPO: dados de exemplo. Endereços, matrículas e valores são fictícios.</div>

<div id="login" style="position:fixed;inset:0;background:#0b5394;display:flex;align-items:center;justify-content:center;z-index:9">
  <div style="background:#fff;padding:24px;border-radius:12px;width:90%;max-width:340px">
    <h2>Entrar no Painel EMBASA</h2>
    <input id="lg_usuario" class="campo" placeholder="Usuário" autocomplete="username">
    <input id="lg_senha" type="password" class="campo" placeholder="Senha" autocomplete="current-password">
    <button class="acao" onclick="entrar()">Entrar</button>
    <button onclick="esqueciSenha()" style="background:none;border:none;color:#0b5394;margin-top:10px;cursor:pointer;text-decoration:underline">Esqueci a senha</button>
    <div id="lg_msg" class="nota"></div>
  </div>
</div>
<main id="app"></main>

<script>
/* ============================================================
   BLOCOS REUTILIZÁVEIS
   ============================================================ */
const BANNER_VERIF = ``;
const AVISO_DIGITINHO =`<div class="aviso"><b>Antes de solicitar SS:</b> confirme que você está logado no Digiteam.</div>`;

// Tela de um macro com consumo automático (chave = nome guardado na planilha)
function macroHTML(titulo, rotulo, chave) {
  return `<h2>${titulo}</h2>
    <input type="date" class="campo" value="2026-11-02">
    <div id="mac_wrap" data-chave="${chave}" class="card" style="margin-bottom:10px">
      <b>${rotulo}</b>
      <input id="mac_leitura" class="campo" placeholder="Leitura 7h (m³)" oninput="calcularMacro()">
      <input id="mac_consumo" class="campo" readonly placeholder="Consumo 24h (automático)">
    </div>
    <button class="acao" onclick="salvarTela(this, 'Leituras')">Salvar macro</button>`;
}

function GRADE(nomes, inicio = 0, fim = 22) {
  const horas = [];
  for (let h = inicio; h <= fim; h += 2) horas.push(String(h).padStart(2, "0") + ":00");
  return `<input type="date" class="campo" value="2026-11-02"><div class="nota">Leitura a cada 2 horas, de ${String(inicio).padStart(2, "0")}:00 às ${String(fim).padStart(2, "0")}:00.</div>
    <table><tr><th>Hora</th>${nomes.map(n => `<th>${n}</th>`).join("")}</tr>` +
    horas.map(h => `<tr><td>${h}</td>${nomes.map(() => `<td><input class="campo" style="margin:0;padding:6px" placeholder="MCA"></td>`).join("")}</tr>`).join("") +
    `</table><button class="acao" style="background:#555" onclick="verHistorico('Niveis')">Ver histórico de níveis</button>`;
}

function tabela(cab, linhas) {
  return `<table><tr>${cab.map(c => `<th>${c}</th>`).join("")}</tr>` +
    linhas.map(l => `<tr>${l.map(c => `<td>${c}</td>`).join("")}</tr>`).join("") + `</table>`;
}

const ATUALIZADO = `<div class="atualizado">Última atualização do SCI: 09:00 (próxima: 10:00)</div>`;

/* Telas de exemplo */
const TELAS = {
  vencimentos: () => ATUALIZADO + `
    <h2>Vencimentos</h2>
    ${tabela(["Prazo","Tipo","Localidade / Bairro","Matrícula","Endereço"],[
      ['<span class="tag t-venc">Até 24h</span>','Corte','Sede / Bairro A','000001','Rua exemplo, 10'],
      ['<span class="tag t-venc">Até 24h</span>','Vazamento de rede','Sede / Bairro B','–','Rua exemplo, 25'],
      ['<span class="tag t-alerta">24h a 48h</span>','Religação','Sede / Bairro A','000002','Rua exemplo, 40'],
      ['<span class="tag t-venc">Atrasada</span>','Falta de água','Sede / Bairro C','000003','Rua exemplo, 5']
    ])}
    <div class="nota">Itens com "Estado" preenchido não aparecem aqui. Se a SS já foi executada no Digiteam, aguarda o escritório.</div>`,

  todasSS: () => ATUALIZADO + `
    <h2>Todas as SS abertas (últimos 90 dias)</h2>
    <p><b>Resumo:</b> Corte: 50 · Vazamento: 8 · Religação: 3</p>
    <select class="campo"><option>Todas as localidades</option></select>
    <select class="campo"><option>Todos os bairros</option></select>
    <select class="campo"><option>Ordenar por prazo</option></select>
    ${tabela(["Prazo","Tipo","Bairro","Endereço"],[
      ['Hoje 16h','Corte','Bairro A','Rua exemplo, 1'],
      ['Amanhã','Corte','Bairro A','Rua exemplo, 3'],
      ['Em 3 dias','Corte','Bairro B','Rua exemplo, 9']
    ])}`,

  verificacoes: () => perfilAtual.startsWith("Gerente") ? `
    <h2>Criar verificação rápida</h2>
    <input class="campo" placeholder="Local (ex.: Booster de Porto Rico)">
    <textarea class="campo" rows="2" placeholder="O que verificar (ex.: a bomba está ligada?)"></textarea>
    <select class="campo"><option>Responsável…</option><option>Exemplo: Ramon</option><option>Exemplo: Ivo Carlos</option></select>
    <select class="campo"><option>Prazo…</option><option>Até hoje</option><option>Até amanhã</option></select>
    <button class="acao">Enviar para o funcionário</button>
    <h2 style="margin-top:20px">Acompanhamento</h2>
    <div class="card">Booster de Porto Rico · Pendente · Resultado: –</div>` : `
    <h2>Verificações rápidas</h2>
    <div class="card" style="margin-bottom:10px">
      <b>Booster de Porto Rico: verificar se a bomba está ligada</b><br>
      <span style="font-size:14px">Pedido da gerência · 02/11 06:30 · Prazo: hoje</span><br><br>
      <textarea class="campo" rows="2" placeholder="Resultado (ex.: ligada, funcionando)"></textarea>
      <button class="acao">Marcar como feito</button>
    </div>
    <div class="nota">Verificação não gera SS. Se ficar sem marcar até o fim do dia, aparece para a gerência.</div>`,

  ocorAbrir: () => `
    <h2>Solicitar abertura de ocorrência operacional</h2>
    <input class="campo" placeholder="Localidade e bairro">
    <input class="campo" placeholder="Endereço do problema">
    <select class="campo"><option>Tipo…</option><option>Falta de água</option><option>Falta de energia na unidade</option><option>Outro</option></select>
    <textarea class="campo" rows="3" placeholder="Descrição (quem ligou, desde quando)"></textarea>
    <button class="acao">Enviar para o escritório abrir</button>
    <div class="nota">Pedido enviado. Você acompanha em "Meus pedidos".</div>`,

  ocorEncerrar: () => `
    <h2>Solicitar encerramento de ocorrência operacional</h2>
    <div class="card" style="margin-bottom:10px">Ocorrências abertas na sua localidade (exemplo):<br>
      <b>Falta de energia · Mozondó · aberta 01/11</b></div>
    <select class="campo"><option>Escolha a ocorrência…</option><option>Falta de energia · Mozondó</option></select>
    <textarea class="campo" rows="3" placeholder="Situação atual (ex.: sistema normalizado, bomba ligada)"></textarea>
    <button class="acao">Enviar pedido de encerramento</button>
    <div class="nota">O escritório confirma antes de encerrar no sistema.</div>`,

  nivelAngico: () => `
    <h2>Níveis – ETA Angico</h2>
    ${GRADE(["RAD Angico"], 5, 17)}
    <button class="acao" onclick="salvarTela(this, 'Niveis')">Salvar nível</button>`,

  nivelSD: () => `
    <h2>Níveis – ETA São Desidério</h2>
    ${GRADE(["Semi-enterrado 1", "RAD 2 (apoiado de distribuição 2)"])}
    <button class="acao" onclick="salvarTela(this, 'Niveis')">Salvar níveis</button>`,

  nivelMozondo: () => `
    <h2>Níveis – ETA Mozondó</h2>
    ${GRADE(["Reservatórios ETA Mozondó (um nível, vale para os dois)"])}
    <button class="acao" onclick="salvarTela(this, 'Niveis')">Salvar nível</button>`,

  leituraMozondo: () => {
    const horas = ["08:00","10:00","12:00","14:00","16:00","18:00","20:00","22:00","00:00","02:00","04:00","06:00"];
    return `
    <h2>Leitura diária – ETA Mozondó</h2>
    <input type="date" class="campo" value="2026-11-02">
    <div class="urgente"><b>ALERTA: nível abaixo de 1 m</b><br><span style="font-size:14px">Mozondó · 14h às 18h em 0,0 MCA · enviado para Isaque, Ivo Carlos e Jânio Gualberto em Informações urgentes</span></div>
    <input class="campo" placeholder="Operador">
    <div class="card" style="margin-bottom:10px"><b>Macro saída da ETA</b>
      <input id="ms_leitura" class="campo" value="808184" placeholder="Leitura 7h (m³)" oninput="calcularConsumosMozondo()">
      <input id="ms_consumo" class="campo" readonly placeholder="Consumo 24h (automático)">
    </div>
    <div class="card" style="margin-bottom:10px"><b>Macro Buriti Cortado</b>
      <input id="bc_leitura" class="campo" value="3696" placeholder="Leitura 7h (m³)" oninput="calcularConsumosMozondo()">
      <input id="bc_consumo" class="campo" readonly placeholder="Consumo 24h (automático)">
    </div>
    <h2>Nível do reservatório (MCA, a cada 2h)</h2>
    <table><tr><th>Hora</th><th>Nível (MCA)</th></tr>
    ${horas.map((h, i) => `<tr><td>${h}</td><td><input class="campo" style="margin:0;padding:6px" value="${["5.0","5.0","5.0","0.0","0.0","0.0","0.8","1.0","1.6","2.0","3.0","3.0"][i]}"></td></tr>`).join("")}
    </table>
    <h2 style="margin-top:14px">Observações</h2>
    <textarea class="campo" rows="3" placeholder="Observações do dia"></textarea>
    <button class="acao" onclick="salvarTela(this, 'Leituras')">Salvar no histórico do app</button>
    <button class="acao" style="background:#555" onclick="verHistorico('Leituras')">Ver histórico de leituras</button>
    <div class="nota">Não gera texto para o grupo. Nível de 1 m ou menos aparece em Informações urgentes para todos.</div>`;
  },

  coelba: () => `
    <h2>Reclamação Coelba</h2>
    <div><label><input type="radio" name="cb_tipo" value="Qualidade"> Qualidade</label> &nbsp; <label><input type="radio" name="cb_tipo" value="Interrupção" checked> Interrupção</label></div>
    <input id="cb_cidade" class="campo" placeholder="Cidade / sistema (ex.: São Desidério - Booster Porto Rico)">
    <select id="cb_conta" class="campo" onchange="preencherContaCoelba()"><option value="">Conta contrato…</option>${CONTRATOS_COELBA.map(([c, s, ci]) => `<option value="${c}|${s}|${ci}">${c} – ${s}</option>`).join("")}</select>
    <input id="cb_nota" class="campo" placeholder="Nota de reclamação">
    <input id="cb_protocolo" class="campo" placeholder="Protocolo">
    <div class="nota">Data e hora do problema</div>
    <input type="datetime-local" id="cb_inicio" class="campo">
    <div class="nota">Data e hora da abertura</div>
    <input type="datetime-local" id="cb_abertura" class="campo">
    <select id="cb_obs" class="campo" onchange="document.getElementById('cb_obs_outra').style.display = this.value === 'Outra (digitar)' ? '' : 'none'"><option>Observação…</option><option>Sem energia</option><option>Cabo caído</option><option>Acidente no poste</option><option>Outra (digitar)</option></select>
    <input id="cb_obs_outra" class="campo" placeholder="Digite a observação" style="display:none">
    <button class="acao" onclick="gerarTextoCoelba()">Gerar texto para o grupo</button>
    <textarea id="cb_texto" class="campo" rows="6" placeholder="O texto aparece aqui para copiar"></textarea>
    <button class="acao" onclick="copiarTextoCoelba()">Copiar texto</button>`,

  quimicoAlimentar: () => `
    <h2>Produto químico – alimentar o sistema</h2>
    <select id="qm_local" class="campo"><option value="">ETA…</option>${ETAS_QUIMICO.map(l => `<option>${l}</option>`).join("")}</select>
    <select id="qm_tipo" class="campo"><option>Retirada</option><option>Recebimento</option><option>Consumo</option></select>
    <input id="qm_produto" class="campo" placeholder="Produto">
    <input id="qm_qtd" class="campo" placeholder="Quantidade">
    <input id="qm_un" class="campo" placeholder="Unidade (ex.: kg, litros)">
    <input type="datetime-local" id="qm_data" class="campo">
    <textarea id="qm_obs" class="campo" rows="2" placeholder="Observação"></textarea>
    <button class="acao" onclick="salvarQuimico()">Salvar no sistema</button>`,

  quimicoHistorico: () => `<div class="nota">Carregando histórico...</div>`,

  quimicoEstoque: () => `
    <h2>Estoque de produto químico</h2>
    <select id="qe_local" class="campo" onchange="mostrarEstoqueQuimico()"><option value="">ETA…</option>${ETAS_QUIMICO.map(l => `<option>${l}</option>`).join("")}</select>
    <select id="qe_produto" class="campo" onchange="mostrarEstoqueQuimico()"><option value="">Produto…</option>${PRODUTOS_QUIMICO.map(p => `<option>${p}</option>`).join("")}</select>
    <div id="qe_saldo" class="nota"></div>
    <button class="acao" onclick="mostrarEstoqueQuimico()">Consultar</button>`,

  nivelHistorico: () => `<div class="nota">Carregando histórico...</div>`,

  macrosMozondo: () => `
    <h2>Alimentar planilha dos macros – ETA Mozondó</h2>
    <input type="date" class="campo" value="2026-11-02">
    <div class="card" style="margin-bottom:10px"><b>Macro saída da ETA</b>
      <input id="ms_leitura" class="campo" placeholder="Leitura 7h (m³)" oninput="calcularConsumosMozondo()">
      <input id="ms_consumo" class="campo" readonly placeholder="Consumo 24h (automático)">
    </div>
    <div class="card" style="margin-bottom:10px"><b>Macro Buriti Cortado</b>
      <input id="bc_leitura" class="campo" placeholder="Leitura 7h (m³)" oninput="calcularConsumosMozondo()">
      <input id="bc_consumo" class="campo" readonly placeholder="Consumo 24h (automático)">
    </div>
    <button class="acao" onclick="salvarTela(this, 'Leituras')">Salvar macros</button>`,

  macrosSD: () => macroHTML("Alimentar planilha dos macros – São Desidério", "Macro saída da ETA", "SD – Macro saída da ETA"),

  macrosAngico: () => macroHTML("Alimentar planilha dos macros – Angico", "Saída da ETA", "ANG – Saída da ETA"),

  escalaMozondo: () => {
    const meses = [];
    for (let a = 2026; a <= 2027; a++) {
      for (let m = 0; m < 12; m++) {
        if (a === 2026 && m < 10) continue;
        meses.push([a, m]);
      }
    }
    return `<h2>Escala de turno – ETA Mozondó</h2>
      <div class="grid">${meses.map(([a, m]) => `<button class="btn" onclick="mostrarEscalaMes(${a}, ${m})">${NOMES_MESES[m]} ${a}</button>`).join("")}</div>
      <div id="escala_mes"></div>`;
  },

  busca: () => `
    <h2>Buscar cliente</h2>
    <input class="campo" placeholder="Matrícula">
    <input class="campo" placeholder="Número do hidrômetro">
    <input class="campo" placeholder="Nome do cliente">
    <input class="campo" placeholder="Localidade, bairro ou logradouro (ajuda a filtrar)">
    <button class="acao">Pesquisar</button>
    <div class="nota">Depois de achar a matrícula, você escolhe: 2ª via, débitos ou análise de consumo.</div>`,

  meusPedidos: () => `
    <h2>Meus pedidos</h2>
    ${tabela(["Data","Tipo","Situação","Protocolo"],[
      ['02/11','SS para Digiteam','<span class="tag t-ok">Concluído</span>','000000'],
      ['02/11','Pedido de EPI (lote do mês)','<span class="tag t-alerta">Em andamento</span>','–'],
      ['01/11','Aquisição (RILC)','<span class="tag t-ok">Recebido</span>','–']
    ])}
    <div class="nota">Situação atualizada pelo escritório. Itens recebidos ficam aqui até o fim do mês.</div>`,

  planejamento: () => `
    <h2>Pedido de planejamento</h2>
    <input class="campo" placeholder="Data do planejamento">
    <input class="campo" placeholder="Período (de / até)">
    <select class="campo"><option>Região…</option><option>Sede</option><option>Angico</option></select>
    <select class="campo"><option>Serviços…</option><option>Corte</option><option>Religação</option><option>Vazamento</option></select>
    <button class="acao">Gerar texto do pedido</button>
    <div class="nota">O texto vai para o escritório. Quando estiver pronto, aparece em "Meus pedidos".</div>`,

  solicitarSS: () => AVISO_DIGITINHO + `
    <h2>Gerar SS</h2>
    <button class="acao" onclick="alert('Protótipo: aqui o formulário gera a SS para o Digiteam.')">Gerar SS e mandar para o Digiteam</button>
    <button class="acao" style="background:#2e7d32" onclick="alert('Protótipo: aqui o formulário gera a SS para o escritório encerrar (já executada em campo).')">Gerar SS para o escritório encerrar</button>
    <div class="nota">Quando a SS já existir no Digiteam, não precisa gerar outra. Veja em "Vencimentos".</div>`,

  segundaVia: () => `
    <h2>Segunda via</h2>
    <input class="campo" placeholder="Matrícula, ou nome + localidade + bairro">
    <button class="acao">Buscar e gerar 2ª via</button>
    <div class="nota">Não abre SS. O escritório puxa a 2ª via direto no SCI.</div>`,

  debitos: () => `
    <h2>Débitos em atraso</h2>
    <input class="campo" placeholder="Matrícula ou nome">
    <button class="acao">Consultar e gerar PDF das faturas em atraso</button>
    <div class="nota">Exemplo: a tela mostra as faturas e você marca quais imprimir.</div>`,

  analiseConsumo: () => `
    <h2>Análise de consumo</h2>
    <input class="campo" placeholder="Matrícula">
    <input class="campo" placeholder="Número do hidrômetro">
    <button class="acao">Consultar últimas leituras</button>
    <button class="acao" style="background:#555">Consultar titularidade</button>`,

  extensaoRede: () => `
    <h2>Solicitação de extensão de rede</h2>
    <input class="campo" placeholder="Logradouro">
    <input class="campo" placeholder="Bairro">
    <input class="campo" placeholder="Localidade">
    <input class="campo" placeholder="Quantidade de ligações beneficiadas">
    <input class="campo" placeholder="Metragem da extensão (opcional)">
    <input class="campo" placeholder="Quantidade de tubos">
    <select class="campo"><option>Tipo de abastecimento…</option><option>Rede de distribuição</option><option>Booster</option><option>Reservatório elevado</option><option>Reservatório apoiado</option></select>
    <select class="campo"><option>O cliente pode abrir a cava?</option><option>Sim</option><option>Não</option></select>
    <button class="acao">Gerar ESS para o Edivaldo</button>`,

  metas: () => `
    <h2>Minhas metas</h2>
    <div class="cards">
      <div class="card"><b>Arrecadação</b><br>Hoje: R$ 0.000,00 · Mês: R$ 00.000,00 de R$ 000.000,00</div>
      <div class="card"><b>Ligações novas</b><br>Feitas: 12 de 40 · Faltam 28 até 30/11</div>

function trocarPerfil() {
  perfilAtual = document.getElementById("perfil").value;
  pilha = [];
  mostrarMenu(PERFIS[perfilAtual], "Início");
}

function mostrarMenu(itens, titulo) {
  const app = document.getElementById("app");
  let html = "";
  if (pilha.length) html += `<button class="voltar" onclick="voltar()">← Voltar</button>`;
  if (!pilha.length && perfilAtual.startsWith("Agente")) html += AVISO_DIGITINHO;
  if (!pilha.length && !perfilAtual.startsWith("Gerente")) html += BANNER_VERIF;
  html += `<h2>${titulo}</h2><div class="grid">`;
  itens.forEach((it, i) => {
    html += `<button class="btn" onclick="abrir(${i})">${it.nome}</button>`;
  });
  html += `</div>`;
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function abrir(i) {
  const menu = pilha.length ? pilha[pilha.length-1].itens : PERFIS[perfilAtual];
  const it = menu[i];
  if (it.sub) {
    pilha.push({itens: it.sub, titulo: it.nome});
    mostrarMenu(it.sub, it.nome);
  } else {
    const app = document.getElementById("app");
    app.innerHTML = `<button class="voltar" onclick="renderAtual()">← Voltar</button>` +
      (TELAS[it.tela] ? TELAS[it.tela]() : "<p>Tela em construção.</p>");
    if (["leituraMozondo", "macrosMozondo", "macrosSD", "macrosAngico"].includes(it.tela)) carregarUltimasLeituras();
    if (it.tela === "quimicoHistorico") verHistorico("Quimicos");
    if (it.tela === "nivelHistorico") verHistorico("Niveis");
    if (it.tela === "episHistorico") verHistorico("EPI");
    if (it.tela === "ferrHistorico") verHistorico("Ferramentas");
    if (it.tela === "horaExtraHist") verHistorico("HoraExtra");
    if (it.tela === "rilcHistorico") verHistorico("RILC");
    if (it.tela === "conertoHistorico") verHistorico("Conserto");
    if (it.tela === "pedMatHist") verHistorico("PedidoMaterial");
    if (it.tela === "gersa") setTimeout(carregarAgersa, 0);
    if (it.tela === "conserto") carregarRegistroEquip();
    if (it.tela === "rotinaHist") verHistorico("Rotina");
    if (it.tela === "equipHist") verHistorico("Equipamentos");
    window.scrollTo(0,0);
  }
}

function renderAtual() {
  if (pilha.length) {
    const top = pilha[pilha.length-1];
    mostrarMenu(top.itens, top.titulo);
  } else {
    mostrarMenu(PERFIS[perfilAtual], "Início");
  }
}

function voltar() {
  if (pilha.length) {
    pilha.pop();
    if (pilha.length) {
      const top = pilha[pilha.length-1];
      mostrarMenu(top.itens, top.titulo);
    } else {
      mostrarMenu(PERFIS[perfilAtual], "Início");
    }
  } else {
    mostrarMenu(PERFIS[perfilAtual], "Início");
  }
}

window.ultimasLeituras = {};

async function carregarUltimasLeituras() {
  window.ultimasLeituras = {};
  try {
    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Leituras" });
    if (res.erro) return;
    const hoje = (document.querySelector('#app input[type="date"]') || {}).value || "";
    res.dados.slice(1).forEach(l => {
      const dia = String(l[0]).slice(0, 10);
      const macro = l[2];
      const leitura = parseFloat(l[3]);
      if (dia < hoje && !isNaN(leitura)) {
        const atual = window.ultimasLeituras[macro];
        if (!atual || dia > atual.dia) window.ultimasLeituras[macro] = { dia: dia, leitura: leitura };
      }
    });
    calcularConsumosMozondo();
    calcularMacro();
  } catch (e) { /* sem histórico ainda */ }
}

function calcularMacro() {
  const wrap = document.getElementById("mac_wrap");
  if (!wrap) return;
  const atual = parseFloat(document.getElementById("mac_leitura").value);
  const anterior = window.ultimasLeituras[wrap.dataset.chave];
  document.getElementById("mac_consumo").value = (!isNaN(atual) && anterior) ? (atual - anterior.leitura).toFixed(1) : "";
}

function calcularConsumosMozondo() {
  [["ms_leitura", "ms_consumo", "Macro saída da ETA"], ["bc_leitura", "bc_consumo", "Macro Buriti Cortado"]].forEach(([leit, cons, nome]) => {
    const atual = parseFloat(document.getElementById(leit).value);
    const anterior = window.ultimasLeituras[nome];
    document.getElementById(cons).value = (!isNaN(atual) && anterior) ? (atual - anterior.leitura).toFixed(1) : "";
  });
}

function gerarTextoQuimico() {
  const n = id => parseFloat(document.getElementById(id).value) || 0;
  const agora = new Date();
  const dataStr = agora.toLocaleDateString("pt-BR");
  const horaStr = agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

  // pref: prefixo dos campos; diasConsumo: 1 (24h) ou 2 (48h, flúor)
  const bloco = (nome, unidade, pref, diasConsumo) => {
    const ant = n(pref + "_ant"), rec = n(pref + "_rec"), cons = n(pref + "_cons");
    const atual = ant + rec - cons;
    const diario = cons / diasConsumo;
    const previsao = diario > 0 ? Math.floor(atual / diario) : "--";
    const rotuloCons = diasConsumo === 2 ? "Última 48h" : "Últimas 24h";
    return nome + "\n" +
      "1. Estoque do Dia Anterior: " + ant + " " + unidade + "\n" +
      "2. Quantidade Recebida (Últimas 24h): " + rec + " " + unidade + "\n" +
      "3. Consumo (" + rotuloCons + "): " + cons + " " + unidade + "\n" +
      "4. Estoque Atual: " + atual + " " + unidade + "\n" +
      "5. Previsão de Duração (com base no consumo atual): " + previsao + " dias";
  };

  const obs = document.getElementById("qm_obs_grupo").value || "Nenhuma";
  const texto = "Formulário Diário de Controle de Estoque de Produtos Químicos - ETA MOZONDÓ\n\n" +
    "Data: " + dataStr + "\n" +
    "Horário do Registro: " + horaStr + "\n\n" +
    bloco("Cloro", "kg", "cl", 1) + "\n\n" +
    bloco("Sulfato", "kg", "su", 1) + "\n\n" +
    bloco("Flúor", "lts", "fl", 2) + "\n\n" +
    "Observações (caso haja anormalidades)\n" + obs + "\n\n" +
    "Colaborador Responsável pela informação.\n" + (window.nomeUsuario || "");
  document.getElementById("qm_texto").value = texto;
}

// Estoque da ETA = recebimento + retirada do almoxarifado − consumo
async function mostrarEstoqueQuimico() {
  const local = document.getElementById("qe_local").value;
  const produto = document.getElementById("qe_produto").value;
  const box = document.getElementById("qe_saldo");
  if (!local || !produto) { box.textContent = "Escolha a ETA e o produto."; return; }
  box.textContent = "Consultando estoque...";
  try {
    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Quimicos" });
    if (res.erro) { box.textContent = res.erro; return; }
    let saldo = 0, unidade = "", movs = 0;
    res.dados.slice(1).forEach(l => {
      // colunas: data_hora, usuario, local, tipo, produto, quantidade, unidade, data_movimento, observacao
      if (l[2] !== local || l[4] !== produto) return;
      const q = parseFloat(l[5]) || 0;
      movs++;
      if (l[6]) unidade = l[6];
      saldo += l[3] === "Consumo" ? -q : q;
    });
    box.textContent = "Estoque de " + produto + " na " + local + ": " + saldo + " " + unidade + " (" + movs + " movimentações registradas)";
  } catch (e) { box.textContent = "Não consegui consultar agora. Verifique a internet."; }
}

// Base: 02/11/2026 → diurno Genildo, noturno Juvenson. Dia seguinte: Alan e Sandro.
const BASE_ESCALA_MOZONDO = Date.UTC(2026, 10, 2);
const NOMES_MESES = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

function turnoMozondo(ano, mes, dia) {
  const diff = Math.round((Date.UTC(ano, mes, dia) - BASE_ESCALA_MOZONDO) / 86400000);
  const par = ((diff % 2) + 2) % 2 === 0;
  return { diurno: par ? "Genildo" : "Alan", noturno: par ? "Juvenson" : "Sandro" };
}

function mostrarEscalaMes(ano, mes) {
  const total = new Date(Date.UTC(ano, mes + 1, 0)).getUTCDate();
  let linhas = "";
  for (let dia = 1; dia <= total; dia++) {
    const t = turnoMozondo(ano, mes, dia);
    const semana = new Date(Date.UTC(ano, mes, dia)).toLocaleDateString("pt-BR", { weekday: "short", timeZone: "UTC" });
    linhas += `<tr><td>${String(dia).padStart(2, "0")}/${String(mes + 1).padStart(2, "0")}</td><td>${semana}</td><td>${t.diurno}</td><td>${t.noturno}</td></tr>`;
  }
  document.getElementById("escala_mes").innerHTML = `<h2>${NOMES_MESES[mes]} de ${ano}</h2>` +
    `<table><tr><th>Dia</th><th>Semana</th><th>Diurno</th><th>Noturno</th></tr>${linhas}</table>`;
}

// ===== DEMANDAS AGERSA (cada um vê só a sua localidade) =====
function localidadeVisivel(local) {
  if (window.MODO_GERENTE) return true;
  return (window.usuarioLocalidades || []).some(l => l === local);
}

async function carregarAgersa() {
  const box = document.getElementById("ag_lista");
  if (!box) return;
  try {
    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Agersa" });
    if (res.erro) { box.innerHTML = `<p>${res.erro}</p>`; return; }
    // colunas: data_hora, usuario, localidade, demanda, responsavel, situacao
    const minhas = res.dados.slice(1).filter(l => localidadeVisivel(l[2]));
    box.innerHTML = minhas.length === 0 ? '<div class="nota">Nenhuma demanda da sua localidade.</div>' :
      minhas.map(l => `
        <div class="card" style="margin-bottom:10px">
          <b>${l[3]}</b><br>
          <span style="font-size:14px">${l[2]} · Responsável: ${l[4] || "--"} · Situação: ${l[5] || "--"}</span>
          <div class="nota">Fotos de evidência (inclua as fotos do local: cerca toda, vários ângulos, limpeza)</div>
          <input type="file" accept="image/*" multiple id="ag_foto_${minhas.indexOf(l)}" class="campo">
          <button class="acao" onclick="enviarEvidenciaAgersa(${minhas.indexOf(l)}, '${l[2]}', '${String(l[3]).replace(/'/g, "")}')">Enviar evidências</button>
        </div>`).join("");
    window.agersaMinhas = minhas;
  } catch (e) { box.innerHTML = '<div class="nota">Não consegui carregar. Verifique a internet.</div>'; }
}

async function enviarEvidenciaAgersa(indice, local, demanda) {
  const arquivos = document.getElementById("ag_foto_" + indice).files;
  if (!arquivos.length) { alert("Escolha as fotos."); return; }
  try {
    for (const arquivo of arquivos) {
      const base64 = await lerArquivoBase64(arquivo);
      const r = await chamarApi({ acao: "salvarFoto", usuario: window.credenciais.usuario, senha: window.credenciais.senha,
        base64: base64, tipo: arquivo.type, nome: arquivo.name });
      if (r.erro) { alert(r.erro); return; }
      await chamarApi({ acao: "gravarVarias", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "AgersaEvidencia",
        linhas: [[new Date().toISOString(), window.credenciais.usuario, local, demanda, r.url]] });
    }
    alert("Evidências enviadas.");
  } catch (e) { alert("Não consegui enviar. Verifique a internet."); }
}

// ===== CADASTRO E PREENCHIMENTO DE EQUIPAMENTOS (aba Equipamentos) =====
window.registroEquip = [];

async function carregarRegistroEquip() {
  window.registroEquip = [];
  try {
    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Equipamentos" });
    if (!res.erro) {
      // colunas: data_hora, usuario, localidade, equipamento, tipo, nome, modelo, patrimonio, especificacao, foto
      window.registroEquip = res.dados.slice(1).map(l => ({ local: l[2], equip: l[3], tipo: l[4], nome: l[5], modelo: l[6], patrimonio: l[7] }));
    }
  } catch (e) { /* sem registro ainda */ }
}

function preencherEquipamento() {
  const local = document.getElementById("cs_local").value;
  const equip = document.getElementById("cs_equip").value;
  const achados = window.registroEquip.filter(r => r.local === local && r.equip === equip);
  if (achados.length === 0) return;
  const ultimo = achados[achados.length - 1];
  document.getElementById("cs_nome").value = ultimo.nome || "";
  document.getElementById("cs_modelo").value = ultimo.modelo || "";
  document.getElementById("cs_patrimonio").value = ultimo.patrimonio || "";
}

function lerArquivoBase64(arquivo) {
  return new Promise((resolver, rejeitar) => {
    const leitor = new FileReader();
    leitor.onload = () => resolver(String(leitor.result).split(",")[1]);
    leitor.onerror = rejeitar;
    leitor.readAsDataURL(arquivo);
  });
}

async function salvarCadastroEquip() {
  const local = document.getElementById("ce_local").value;
  const equip = document.getElementById("ce_equip").value;
  if (!local || !equip) { alert("Informe a localidade e o equipamento."); return; }
  let fotoUrl = "";
  const arquivo = document.getElementById("ce_foto").files[0];
  try {
    if (arquivo) {
      const base64 = await lerArquivoBase64(arquivo);
      const r = await chamarApi({ acao: "salvarFoto", usuario: window.credenciais.usuario, senha: window.credenciais.senha,
        base64: base64, tipo: arquivo.type, nome: arquivo.name });
      if (r.erro) { alert(r.erro); return; }
      fotoUrl = r.url;
    }
    const linha = [new Date().toISOString(), window.credenciais.usuario, local, equip,
      document.getElementById("ce_tipo").value, document.getElementById("ce_nome").value,
      document.getElementById("ce_modelo").value, document.getElementById("ce_patrimonio").value,
      document.getElementById("ce_especificacao").value, fotoUrl];
    const res = await chamarApi({ acao: "gravarVarias", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Equipamentos", linhas: [linha] });
    alert(res.erro ? res.erro : "Equipamento cadastrado.");
    carregarRegistroEquip();
  } catch (e) { alert("Não consegui salvar. Verifique a internet."); }
}

// ===== ALMOXARIFADO DE SÃO DESIDÉRIO: saldo = contagem + movimentações =====
function itemCatalogo(codigo) {
  return CATALOGO_ALMOX.find(i => i[0] === codigo);
}

async function mostrarSaldo() {
  const cod = document.getElementById("ac_mat").value;
  const local = document.getElementById("ac_local").value;
  const box = document.getElementById("ac_saldo");
  if (!cod || !local) { box.textContent = local ? "" : "Escolha o local primeiro."; return; }
  const item = itemCatalogo(cod);
  // A contagem atual é só da ETA São Desidério; os outros locais começam em zero
  const base = local === "ETA São Desidério" ? (parseFloat(item[2]) || 0) : 0;
  box.textContent = "Consultando saldo...";
  try {
    const res = await chamarApi({ acao: "listar", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Almoxarifado" });
    let mov = 0;
    if (!res.erro) {
      res.dados.slice(1).forEach(l => {
        // colunas: data_hora, usuario, local, tipo, material, quantidade, observacao
        if (l[2] === local && String(l[4]).startsWith(cod + " –")) {
          const q = parseFloat(l[5]) || 0;
          mov += String(l[3]).startsWith("Entrada") ? q : -q;
        }
      });
    }
    box.textContent = "Saldo atual: " + (base + mov) + " (contagem: " + base + ", movimentações desde a contagem: " + mov + ")";
  } catch (e) { box.textContent = "Não consegui consultar agora. Verifique a internet."; }
}

async function movimentarCatalogo() {
  const cod = document.getElementById("ac_mat").value;
  const qtd = document.getElementById("ac_qtd").value;
  const local = document.getElementById("ac_local").value;
  if (!local || !cod || !qtd) { alert("Escolha o local, o material e a quantidade."); return; }
  if (!podeMovimentarAlmox(local)) { alert("Só a equipe de " + local + " pode retirar ou adicionar neste almoxarifado. Você pode consultar o saldo e fazer pedido de material."); return; }
  const item = itemCatalogo(cod);
  const linha = [new Date().toISOString(), window.credenciais.usuario, local, document.getElementById("ac_tipo").value,
    cod + " – " + item[1], qtd, document.getElementById("ac_obs").value];
  try {
    const res = await chamarApi({ acao: "gravarVarias", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Almoxarifado", linhas: [linha] });
    alert(res.erro ? res.erro : "Movimentação registrada.");
    mostrarSaldo();
  } catch (e) { alert("Não consegui registrar. Verifique a internet."); }
}

async function enviarConserto() {
  const local = document.getElementById("cs_local").value;
  const equip = document.getElementById("cs_equip").value;
  const retirada = document.getElementById("cs_tipo").value === "Reforma" &&
    document.getElementById("cs_ret_tipo").value === "Retirada de vazamento";
  if (!local) { alert("Escolha a localidade."); return; }
  if (!retirada && !equip) { alert("Escolha o equipamento."); return; }
  let equipamento = equip;
  if (retirada) {
    const dn = document.getElementById("cs_ret_dn").value;
    if (!dn) { alert("Informe o DN do tubo."); return; }
    equipamento = "Retirada de vazamento – DN " + dn + " mm";
  }
  if (equip.startsWith("Outro")) equipamento = document.getElementById("cs_outro").value.trim();
  if (equip === "Dosadora") {
    const dos = document.getElementById("cs_dos").value;
    if (!dos) { alert("Escolha qual dosadora: sulfato, flúor ou cloro."); return; }
    equipamento = "Dosadora – " + dos;
  }
  const u = window.credenciais.usuario;
  const linha = [new Date().toISOString(), u, local, equipamento, document.getElementById("cs_nome").value,
    document.getElementById("cs_modelo").value, document.getElementById("cs_tipo").value,
    document.getElementById("cs_desc").value];
  const patrimonio = document.getElementById("cs_patrimonio").value;
  const modelo = document.getElementById("cs_modelo").value;
  const nome = document.getElementById("cs_nome").value;
  try {
    const res = await chamarApi({ acao: "gravarVarias", usuario: u, senha: window.credenciais.senha, aba: "Conserto", linhas: [linha] });
    // guarda o modelo e o patrimônio para os próximos pedidos
    if (modelo || patrimonio || nome) {
      chamarApi({ acao: "gravarVarias", usuario: u, senha: window.credenciais.senha, aba: "Equipamentos",
        linhas: [[new Date().toISOString(), u, local, equipamento, "", nome, modelo, patrimonio, "", ""]] });
    }
    alert(res.erro ? res.erro : "Pedido enviado para a gerência.");
  } catch (e) {
    alert("Não consegui enviar. Verifique a internet.");
  }
}

      if (idx === 0) return;
      const tds = tr.querySelectorAll("td");
      const hora = tds[0].textContent.trim();
      tds.forEach((td, j) => {
        if (j === 0) return;
        const valor = td.querySelector("input").value;
        if (valor === "") return;
        linhas.push([data + "T" + hora + ":00", window.credenciais.usuario, heads[j - 1], hora, valor]);
      });
    });
    try {
      const res = await chamarApi({ acao: "gravarVarias", usuario: window.credenciais.usuario, senha: window.credenciais.senha, aba: "Niveis", linhas: linhas });
      alert(res.erro ? res.erro : "Níveis salvos no histórico.");
    } catch (e) {
      alert("Não consegui salvar. Verifique a internet.");
    }
    return;
  }
  const campos = [...area.querySelectorAll("input, textarea, select")].map(c => c.value);
  const titulo = (document.querySelector("#app h2") || {}).textContent || "";
  try {
    const res = await chamarApi({
      acao: "gravar", usuario: window.credenciais.usuario, senha: window.credenciais.senha,
      aba: aba, linha: [titulo, JSON.stringify(campos)]
    });
    alert(res.erro ? res.erro : "Salvo no histórico.");
  } catch (e) {
    alert("Não consegui salvar. Verifique a internet.");
  }
}

// ===== ESQUECI A SENHA (pede à gerência uma senha nova) =====
async function esqueciSenha() {
  const usuario = document.getElementById("lg_usuario").value.trim();
  const msg = document.getElementById("lg_msg");
  if (!usuario) { msg.textContent = "Digite seu usuário no campo acima e clique de novo em Esqueci a senha."; return; }
  msg.textContent = "Enviando pedido...";
  try {
    await chamarApi({ acao: "pedirNovaSenha", usuario: usuario });
    msg.textContent = "Pedido enviado. A gerência vai te passar uma senha nova.";
  } catch (e) {
    msg.textContent = "Não consegui enviar o pedido. Verifique a internet.";
  }
}

// ===== TROCAR A PRÓPRIA SENHA =====
function telaTrocarSenha() {
  document.getElementById("app").innerHTML = `
    <button class="voltar" onclick="renderAtual()">← Voltar</button>
    <h2>Trocar minha senha</h2>
    <input id="ts_nova" type="password" class="campo" placeholder="Nova senha (mínimo 6 caracteres)" autocomplete="new-password">
    <input id="ts_conf" type="password" class="campo" placeholder="Repita a nova senha" autocomplete="new-password">
    <button class="acao" onclick="confirmarTrocaSenha()">Salvar nova senha</button>
    <div id="ts_msg" class="nota"></div>`;
}

async function confirmarTrocaSenha() {
  const nova = document.getElementById("ts_nova").value;
  const conf = document.getElementById("ts_conf").value;
  const msg = document.getElementById("ts_msg");
  if (nova !== conf) { msg.textContent = "As senhas não coincidem."; return; }
  try {
    const res = await chamarApi({ acao: "trocarSenha", usuario: window.credenciais.usuario, senha: window.credenciais.senha, novaSenha: nova });
    if (res.erro) { msg.textContent = res.erro; return; }
    window.credenciais.senha = nova;
    msg.textContent = "Senha trocada. Use a nova senha no próximo acesso.";
  } catch (e) {
    msg.textContent = "Não consegui trocar a senha. Verifique a internet.";
  }
}

async function entrar() {
  const usuario = document.getElementById("lg_usuario").value.trim();
  const senha = document.getElementById("lg_senha").value;
  const msg = document.getElementById("lg_msg");
  msg.textContent = "Entrando...";
  try {
    const res = await chamarApi({ acao: "login", usuario, senha });
    if (res.erro) { msg.textContent = res.erro; return; }
    const perfil = MAPA_PERFIS[res.usuario.perfil];
    if (!perfil) { msg.textContent = "Este perfil ainda não está liberado no painel."; return; }
    window.credenciais = { usuario, senha };
    perfilAtual = perfil;
    window.MODO_GERENTE = res.usuario.perfil === "gerente";
    window.nomeUsuario = res.usuario.nome;
    window.usuarioLocalidades = String(res.usuario.localidades || "").split(",").map(s => s.trim()).filter(Boolean);
    document.getElementById("perfil").style.display = res.usuario.perfil === "gerente" ? "" : "none";
    document.getElementById("login").style.display = "none";
    init();
  } catch (e) {
    msg.textContent = "Não consegui conectar. Verifique a internet.";
  }
}
